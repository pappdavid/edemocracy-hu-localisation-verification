        title: FOGYASZTOTT DEMOKRÁCIA
        description: Ingyenes szoftver a polgárok részvételéhez.
        link_text: További információk
      proposal:
        title: Hogyan működnek a polgárok javaslatai?
        description: Egy hely mindenkinek, hogy létrehozza a polgárok javaslatát és támogatást kérjen. Megszavazzuk azokat
          a javaslatokat, amelyek elegendő támogatást nyújtanak, és így közösen dönthetünk a számunkra fontos kérdésekről.
        link_text: Bővebben a javaslatokról
        label: Polgári javaslatok
      budget:
        title: Hogyan működik a részvételi költségvetés?
        description: A részvételi költségvetések lehetővé teszik a polgárok számára, hogy javaslatokat tegyenek és közvetlenül
          döntsenek arról, hogyan költsék el a költségvetés egy részét, figyelemmel kísérve és szigorúan értékelve a javaslatokat.
          Maximális hatékonyság és ellenőrzés mindenki számára kielégítő.
        link_text: Bővebben a részvételi költségvetésről
        label: Közösségi költségvetések
      debate:
        title: Hogyan működnek a viták?
        description: Bárki kinyithat szálakat bármely témában, külön tereket teremtve, ahol az emberek megvitathatják a javasolt
          témát. A vitákat mindenki értékeli, hogy kiemelje a legfontosabb kérdéseket.
        link_text: Bővebben a vitákról
        label: Viták
