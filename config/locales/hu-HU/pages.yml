      how_to_use:
        text: 'Használja a helyi önkormányzat vagy segít nekünk, hogy javítsa, ez ingyenes szoftver.


          Ez a nyitott kormányzati portál használja a [KONSUL DEMOKRÁCIA alkalmazás](https://github.com/consuldemocracy/consuldemocracy
          ''consul democracy github'') Ez ingyenes szoftver, [engedély AGPLv3](http://www.gnu.org/licenses/agpl-3.0.html ''AGPLv3
          gnu'' )Ez egyszerű szavakkal azt jelenti, hogy bárki szabadon használhatja a kódot, lemásolhatja, részletesen megnézheti,
          módosíthatja és újraoszthatja a világ számára a kívánt módosításokkal (lehetővé téve másoknak, hogy ugyanezt tegyék).
          Mert úgy gondoljuk, hogy a kultúra jobb és gazdagabb, ha kiadják.


          Ha programozó, láthatja a kódot, és segít nekünk, hogy javítsa a [KONSUL DEMOKRÁCIA alkalmazás](https://github.com/consuldemocracy/consuldemocracy
          ''consul democracy github'').'
      titles:
        how_to_use: Használja a rendszert a helyi önkormányzatában
