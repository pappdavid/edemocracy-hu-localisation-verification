          description: Annak érdekében, hogy könnyen navigálhasson ezen a webhelyen, gyors hozzáférési kulcsok csoportját
            programozták, amelyek összegyűjtik azokat a főbb, általános érdeklődésre számot tartó részeket, amelyekbe a webhely
            fel van rendezve.
          caption: Billentyűparancsok a navigációs menühöz
          key_header: Kulcsfontosságú
          page_header: oldal
        title: Billentyűparancsok
        browser_table:
          description: 'Az operációs rendszertől és a használt böngészőtől függően a billentyűkombináció a következő lesz:'
          caption: Az operációs rendszertől és a böngészőtől függően billentyűkombináció
          browser_header: Böngésző
          key_header: Kulcskombináció
          rows:
          - browser_column: Internet Explorer
            key_column: ALT + gyorsbillentyű, majd ENTER
          - browser_column: Firefox
            key_column: ALT + SHIFT + gyorsbillentyű
          - browser_column: Chrome
            key_column: ALT + gyorsbillentyű (Macen CTRL + ALT + gyorsbillentyű)
          - browser_column: Safari
            key_column: ALT + gyorsbillentyű (Macen CMD + gyorsbillentyű)
          - browser_column: Opera
            key_column: SHIFT + ESC + gyorsbillentyű
      title: Akadálymentesség
      description: 'A webes akadálymentesség azt jelenti, hogy a webhely és tartalma a lehető legtöbb ember számára hozzáférhető,
        függetlenül az esetleges fogyatékosságtól, technikai korláttól vagy a használat körülményeitől.


        A portál fejlesztésénél törekszünk az akadálymentes használatra, és folyamatosan javítjuk a hozzáférhetőséget. Ha
        akadályt tapasztal, kérjük, jelezze azt az üzemeltetőnek.'
      examples:
      - A képekhez alternatív szöveget adva a vak vagy gyengénlátó felhasználók speciális olvasókkal érhetik el az információkat.
      - Ha a videóknak van felirata, a hallássérült felhasználók teljesen megértik azt.
      - Ha a tartalom egyszerű és illusztrált nyelven van megírva, a tanulási problémákkal küzdő felhasználók jobban meg tudják
        érteni azokat.
      - Ha a felhasználónak mozgási problémái vannak, és nehezen tudja használni az egeret, a billentyűzettel ellátott alternatívák
        segítenek a navigációban.
      textsize:
        title: Szöveg mérete
        browser_settings_table:
          description: A weboldal akadálymentes kialakítása lehetővé teszi, hogy a felhasználó kiválaszthassa a számára megfelelő
            szövegméretet. Ez a művelet a használt böngészőtől függően különböző módon hajtható végre.
          browser_header: Böngésző
          action_header: Intézkedések
          rows:
          - browser_column: Internet Explorer
            action_column: Nézet > Szövegméret
          - browser_column: Firefox
            action_column: Nézet > Nagyítás
          - browser_column: Chrome
            action_column: Beállítások > Megjelenés > Betűméret
          - browser_column: Safari
            action_column: Nézet > Nagyítás / Kicsinyítés
          - browser_column: Opera
            action_column: Nézet > Nagyítás
        browser_shortcuts_table:
          description: 'A szövegméret módosításának másik módja a böngészőkben definiált billentyűparancsok használata, különösen
            a billentyűkombináció:'
          rows:
          - shortcut_column: CTRL és + (CMD és + MAC-on)
            description_column: Növeli a szöveg méretét
          - shortcut_column: CTRL és - (CMD és - MAC-on)
            description_column: Csökkenti a szöveg méretét
      compatibility:
        title: Szabványokkal és vizuális kialakítással való összeegyeztethetőség
        description: A portál célja a <strong>Webes Akadálymentesítési Irányelvek</strong> és a W3C <abbr title="Web Accessibility
          Initiative" lang="en">WAI</abbr> ajánlásainak követése. Az akadálymentesség megfelelőségét rendszeres ellenőrzéssel
          szükséges értékelni.
