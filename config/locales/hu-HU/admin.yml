      feature_disabled: Ez a funkció kikapcsolva. Használata gép tanulás lehetővé teheti, hogy a%{link}.
      feature_disabled_link: Beállítások oldal
      help:
        title_1: Milyen típusú gyógyszer az AI / Machine Learning?
        description_1: Hagyományosan a számítógépes programokat úgy tervezték meg, hogy pontos szabályokat állapítanak meg
          arra vonatkozóan, hogy a programnak mit kell tennie minden egyes helyzetben, és hogyan kell feldolgozni a rendelkezésre
          álló információkat minden pillanatban. Amit általában MI / Machine Learning-nek neveznek, az olyan programok, amelyek
          esetében pontosan az a feladat, amit el kell végezni, és annak értékelése, hogy a feladat jobb vagy rosszabb-e.
          De ellentétben az előbbivel, a rendszer felfedezi vagy megtanulja, mi lenne a legmegfelelőbb módszer a feladat elvégzésére.
        title_2: Mit jelent az AI / Machine Learning modul CONSUL DEMOCRACY?
        description_2: Ez a modul lehetővé teszi bármilyen típusú AI / Machine Learning programok végrehajtását CONSUL DEMOKRACY.
          A programok feldolgozzák a CONSUL DEMOCRACY-ban rendelkezésre álló információkat, és olyan eredményeket hoznak,
          amelyek mind a felhasználók, mind az adminisztrátorok számára lehetővé teszik a polgárok hatékonyabb és intelligensebb
          részvételét. A modult úgy fejlesztették ki, hogy az új programok végrehajtása és működtetése könnyen lehetséges
          legyen, a CONSUL DEMOKRACY általános kódját és az új programok kódját egymástól függetlenül tartva.
        title_3: Hogyan használjuk ezt a modult?
        description_3: Az első használatához a CONSUL DEMOCRACY dokumentációban található utasításokat kell követni a modul
          megfelelő aktiválásához. Miután a modul megfelelően aktiválódott, a programok a "Futtatás szkriptek" fülről kerülnek
          végrehajtásra. A kivitelezés előtt egy lapon láthatjuk a végrehajtási idő becslését és más releváns információkat.
          A kivitelezés végén aktiválhatjuk a CONSUL DEMOCRACY-ban megjelenített tartalmat a "Beállítások" fülről, valamint
          letölthetünk más generált fájlokat, amelyek hasznosak lehetnek számunkra.
        title_4: Új AI / Machine Learning szkriptek végrehajtása
        description_4: Kérjük, használja a korábbi szkripteket példaként.
        description_4b: Az új szkripteket a mappában kell elhelyezni.<code>nyilvános / gép _ tanulás / szkriptek</code>
        description_4c: A script által használt bemeneti adatok JSON fájlként lesznek létrehozva a mappában<code>.. / adatok</code>
        description_4d: A generált kimenetet a mappába kell helyezni<code>.. / adatok</code>
        description_4e: Ajánlott egy független<code>.ini</code>szöveges fájl a szkript beállításaival, a szkript azonos nevével
          és konfiguráló által olvasható. Ez a fájl megkönnyíti a beállítások módosítását az adminisztrátorok.
        description_4f: Javasoljuk, hogy a szkript első sorában egy kezdeti tripla-idézőjeles sztring szerepeljen, amely rövid
          információkat tartalmaz róla, és linkeket tartalmaz minden lényeges információhoz. Ez a sztring automatikusan megjelenik
          az Igazgatási felületen.
        description_4g: Ajánlatos a szkript vonatkozó adatait a<code>.log</code>szöveges fájl, a szkript azonos nevével.
        title_5: Az AI / Machine Learning szkriptek használatához a Python telepítése szükséges a szerverre
        description_5: 'Itt látható az Ubuntu 18.04 szerver példájának útmutatója:'
