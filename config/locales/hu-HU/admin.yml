        info: '<p>Ez az a hely, ahol rendszergazdaként megvalósíthatja és felügyeli a polgárok részvételi folyamatát a városában
          vagy régiójában.</p>


          <p>Ön jelenleg egyike annak a több száz kormánynak és önkormányzatnak világszerte, amelyek a CONSUL DEMOCRACY platformot
          használják a polgárok részvételének gyakorlati megvalósítására. Gratulálunk!</p>


          <p>A CONSUL DEMOCRACY Foundation a globális felhasználói közösség középpontjában áll. Szeretnénk megkérni Önt, hogy
          vegye fel a kapcsolatot, hogy megtudjuk, ki használja a szoftvert, és hogyan segíthetnénk a megvalósításban vagy
          használatban. Alig várjuk, hogy üdvözölhessük a közösségben.</p>


