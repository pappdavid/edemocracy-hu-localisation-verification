      feature_disabled: Ez a funkció le van tiltva. A Machine Learning használatához engedélyezheti az %{link}-ból.
      feature_disabled_link: beállítások oldalon
      help:
        title_1: Mi az AI/gépi tanulás?
        description_1: Hagyományosan a számítógépes programokat úgy tervezték, hogy pontos szabályokat állapítanak meg arra
          vonatkozóan, hogy a programnak mit kell tennie az egyes helyzetekben, és hogyan kell minden pillanatban feldolgozni
          a rendelkezésre álló információkat. A közismert nevén AI/gépi tanulás olyan programok, amelyeknél pontosan meghatározható,
          hogy mi az elvégzendő feladat, és hogyan értékelik, hogy a feladatot jobban vagy rosszabbul hajtják-e végre. De
          az előbbitől eltérően a rendszer felfedezi vagy megtanulja, hogy mi lenne a legmegfelelőbb módszer a feladat végrehajtására.
        title_2: Mit jelent az AI / Machine Learning modul a KONZULI DEMOKRÁCIÁBAN?
        description_2: Ez a modul lehetővé teszi bármilyen típusú mesterséges intelligencia/gépi tanulási program megvalósítását
          a CONSUL DEMOKRÁCIÁBAN. A programok képesek feldolgozni a CONSUL DEMOKRÁCIÁBAN elérhető információkat, és olyan
          eredményeket produkálni, amelyek mind a felhasználók, mind az adminisztrátorok hatékonyabb és intelligensebb állampolgári
          részvételt tesznek lehetővé. A modult úgy fejlesztették ki, hogy megkönnyítse az új programok bevezetését és futtatását,
          a CONSUL DEMOKRÁCIA általános kódját és ezen új programok kódjait egymástól függetlenül megőrizve.
        title_3: Hogyan kell használni ezt a modult
        description_3: Az első használathoz kövesse a CONSUL DEMOCRACY dokumentációjában található utasításokat a modul megfelelő
          aktiválásához. A modul helyes aktiválása után a programok a "Szkriptek végrehajtása" fülről futnak le. A végrehajtás
          előtt ugyanazon a lapon láthatjuk a végrehajtási idő becslését és egyéb releváns információkat. A végrehajtás végén
          a "Beállítások" fülről aktiválhatjuk a CONSUL DEMOCRACY-ban megjelenő tartalmakat, valamint letölthetünk más generált
          fájlokat, amelyek hasznosak lehetnek számunkra.
        title_4: Új AI/Gépi tanulási szkriptek implementálása
        description_4: Kérjük, használja a korábbi szkripteket példaként.
        description_4b: Az új szkripteknek a <code>public/machine_learning/scripts</code> mappában kell lenniük.
        description_4c: A szkript által használandó bemeneti adatok JSON-fájlokként jönnek létre az <code>../data</code> mappában
        description_4d: Minden generált kimenetet az <code>../data</code> mappába kell helyezni
        description_4e: Javasoljuk, hogy készítsünk egy független <code>.ini</code> szövegfájlt a szkript beállításaival,
          ugyanazzal a névvel, mint a szkript, és a configparser által olvasható. Ez a fájl megkönnyíti a beállítások módosítását
          a rendszergazdák által.
        description_4f: Javasoljuk, hogy a szkript első sorában szerepeltessen egy kezdeti hármas idézőjelből álló karakterláncot,
          amelyhez néhány rövid információ és a releváns információkra mutató hivatkozások szerepelnek. Ez a karakterlánc
          automatikusan megjelenik az adminisztrációs felületen.
        description_4g: Javasoljuk, hogy a szkript releváns információit egy <code>.log</code> szövegfájlban naplózza, a szkript
          azonos nevével.
        title_5: Az AI / Machine Learning szkriptek használatához telepíteni kell a Pythont a szerverére
        description_5: 'Itt láthatja az Ubuntu 18.04 kiszolgálóhoz tartozó példa utasításokat:'
