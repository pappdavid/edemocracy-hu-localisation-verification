      subject: Valaki megjegyzést fűzött a %{commentable}
      title: Új megjegyzés
    config:
      notifications_link: Értesítések
      unsubscribe_text: Ha le szeretne iratkozni ezekről az e-mailekről, látogasson el a %{notifications} oldalra, és törölje
        az „%{notification} jelét”.
    email_verification:
      click_here_to_verify: ezt a linket
      instructions_2: 'Ez az e-mail igazolja fiókját a következővel: <b>%{document_type} %{document_number}</b>. Ha ezek nem
        az Öné, kérjük, ne kattintson az előző linkre, és hagyja figyelmen kívül ezt az e-mailt.'
      instructions: A felhasználói fiók ellenőrzésének befejezéséhez kattintson az %{verification_link} gombra.
      subject: Erősítse meg e-mail címét
      thanks: Köszönöm szépen.
      title: Erősítse meg e-mail címét
      text: Erősítse meg fiókját a következő link segítségével.
    reply:
      hi: Szia
      new_reply_by: 'Új választ érkezett <strong>%{commenter}</strong> a következőhöz fűzött megjegyzésedre:'
      subject: Valaki válaszolt a megjegyzésére
      title: Új válasz a hozzászólásodra
    proposal_notification_digest:
      info: Itt vannak azok az új értesítések, amelyeket az %{org_name}-ben támogatott javaslatok szerzői tettek közzé.
      title: Ajánlatértesítések %{org_name}
      share: Ossza meg az ajánlatot
      comment: Megjegyzés javaslat
      unsubscribe_text: Ha nem szeretne értesítést kapni az ajánlatokról, látogasson el az %{notifications} oldalra, és törölje
        a jelölést az „Ajánlati értesítések összefoglalójának fogadása” jelölőnégyzetből.
      unfollow: Látogassa meg ezt az ajánlatot, és hagyja abba a követését, ha nem szeretne értesítéseket kapni.
    direct_message_for_receiver:
      subject: Új privát üzenet érkezett
      reply: 'Válasz erre: %{sender}'
      unsubscribe_text: Ha nem szeretne közvetlen üzeneteket kapni, látogasson el az %{notifications} oldalra, és törölje
        a jelet az „E-mailek fogadása a közvetlen üzenetekről” jelölőnégyzetből.
    direct_message_for_sender:
      subject: Új privát üzenetet küldött
      title: Új privát üzenetet küldött
      text: 'Új privát üzenetet küldött a <strong>%{receiver}</strong> címre a következő tartalommal:'
    user_invite:
      ignore: Ha nem kérte ezt a meghívót, ne aggódjon, figyelmen kívül hagyhatja ezt az e-mailt.
      text: 'Köszönjük, hogy jelentkezett az %{org} csoportba! Másodperceken belül részt vehet, csak töltse ki az alábbi űrlapot:'
      thanks: Köszönöm szépen.
      title: Üdvözli az %{org}
      button: Teljes regisztráció
      subject: Meghívás %{org_name}
    budget_investment_created:
      subject: Köszönjük a befektetést!
      title: Köszönjük a befektetést!
      intro: Szia <strong>%{author}</strong>!
      text: Köszönjük, hogy létrehozta <strong>%{investment}</strong> befektetését a közösségi költségvetéshez <strong>%{budget}</strong>.
      follow: Tájékoztatjuk Önt a folyamat előrehaladásáról, amit az <strong>%{link}</strong> oldalon is követhet.
      follow_link: közösségi költségvetések
      sincerely: Őszintén,
      share: Ossza meg projektjét
    budget_investment_unfeasible:
      title: Beruházási projektjét megvalósíthatatlanként jelölték meg
      hi: Kedves felhasználó!
      new: 'Mindezekhez egy <strong>új beruházás</strong> kidolgozására kérjük, amely alkalmazkodik ennek a folyamatnak a
        feltételeihez. Ezt a következő linken teheti meg: %{url}.'
      new_href: új beruházási projekt
      sincerely: Őszintén
      sorry: Elnézést kérünk a kellemetlenségért, és még egyszer köszönjük a felbecsülhetetlen értékű részvételt.
      subject: Az Ön „%{code}” beruházási projektjét megvalósíthatatlanként jelölték meg
    budget_investment_selected:
      subject: Az Ön „%{code}” beruházási projektje kiválasztásra került
      title: Beruházási projektjét kiválasztottuk
      hi: Kedves felhasználó!
      share: Kezdjen el szavazatokat szerezni, ossza meg befektetési projektjét a közösségi hálózatokon. A megosztás elengedhetetlen
        ahhoz, hogy ez valósággá váljon.
      share_button: Ossza meg beruházási projektjét
      thanks: Még egyszer köszönöm a részvételt.
      sincerely: Őszintén
    budget_investment_unselected:
      subject: Az Ön „%{code}” beruházási projektje nincs kiválasztva
      title: Beruházási projektjét nem választották ki
      hi: Kedves felhasználó!
      thanks: Még egyszer köszönöm a részvételt.
      sincerely: Őszintén
    evaluation_comment:
      subject: Új értékelési megjegyzés
      title: 'Új értékelési megjegyzés a következőhöz: %{investment}'
      hi: Szia
      new_comment_by: Új értékelési megjegyzés érkezett az <strong>%{commenter}</strong> költségvetési beruházáshoz %{investment}
      commenter_info: '%{commenter}, %{time}:'
    machine_learning_error:
      link: Látogassa meg a Machine Learning panelt
      subject: Gépi tanulás – Hiba történt a szkript futtatásakor
      text: Hiba történt a Machine Learning parancsfájl futtatásakor.
      title: Gépi tanulási szkript
    machine_learning_success:
      link: Látogassa meg a Machine Learning panelt
      subject: Gépi tanulás – A tartalom létrehozása sikeresen megtörtént
      text: A tartalom létrehozása sikeresen megtörtént.
      title: Gépi tanulási szkript
    new_actions_notification_on_create:
      subject: Az állampolgári javaslattervezet elkészült
      hi: Szia %{name}!
      introduction: Az Ön %{title} ajánlata sikeresen létrejött.
      text_1: Használja ki, hogy ajánlata még nem nyilvános, és készüljön fel arra, hogy sok emberrel kapcsolatba lépjen.
      text_2: Ha készen áll, tegye közzé állampolgári javaslatát erről az <a href='%{link}'>linkről</a>.
      text_3: Tudjuk, hogy az ajánlat megalkotása és a szükséges támogatás megszerzése bonyolultnak tűnhet. De ne aggódj,
        mert mi segítünk neked!
      text_4: 'Van egy eszköze, amely az új legjobb szövetségese lesz: az Állampolgári javaslatok panel.'
      list_1: Írjon be minden nap az ajánlat panelbe, hogy felhasználja azokat a tippeket és forrásokat, amelyeket megosztunk
        Önnel.
      list_2: Ezek a tippek, intézkedések és források ötleteket és gyakorlati megoldásokat adnak, hogy több támogatást és
        szélesebb közösséget szerezzenek. Ne felejtsd el őket!
      list_3: Ahogy egyre több támogatásra tesz szert, új és jobb erőforrásokat szabadít fel. Jelenleg van egy e-mail-sablonja,
        amelyet tömegesen elküldhet az összes kapcsolattartójának, egy poszter, amelyet kinyomtathat, többek között olyan
        funkciók és jutalmak, amelyeket felfedezhet. Ne hagyja abba a támogatás hozzáadását, és mi nem hagyjuk abba a jutalmazást
        és a segítést!
      list_4: '%{max_month} hónapja van az ajánlat közzététele óta, hogy %{max_votes} támogatást kapjon, és ajánlata valósággá
        válhat. De az első napok a legfontosabbak. Ez egy kihívás. Készülj fel!'
      text_5: És hogy minden motivációval kezdje,
      text_6: itt számos forrás és tippek listája található, amelyek minden nap eljönnek Önhöz az adás előkészítéséhez!
      dashboard_button: Hajrá, fedezd fel őket!
    new_actions_notification_on_published:
      subject: Az Ön állampolgári javaslata már megjelent. Ne hagyd abba a terjedést!
      hi: Gratulálunk %{name}! Az Ön %{title} ajánlata sikeresen létrejött.
      text_1: És most szerezze meg az első 100 támogatást!
      text_2: Miért 100?
      text_3: Tapasztalataink azt mutatják, hogy az első nap alapvető. Mert amellett, hogy van energiája valami új elindítására,
        mivel egy újonnan megjelent javaslat, fontos láthatósága lesz, hogy az új javaslatok között szerepel.
      text_4: Szerezzen 100 támogatást az első napon, és egy első közösség áll rendelkezésére.
      text_5: Ezért kihívjuk Önt, hogy szerezze meg, de nem sok segítség nélkül!
      text_6: Ne feledje, hogy a pályázati panelen új források állnak rendelkezésre, és ajánlások állnak rendelkezésre a terjesztési
        tevékenységekhez.
      list_1: Jöjjön be minden nap, hogy lássa a fejlődését, és használja a tippeket és forrásokat, amelyeket megosztunk Önnel.
        Ezek ötletek és gyakorlati megoldások is a szükséges támogatás megszerzéséhez.
      list_2: Amint több támogatást kap, új és jobb erőforrásokat szabadít fel. Ne hagyja abba a támogatás hozzáadását, és
        mi nem hagyjuk abba a jutalmazást és a segítést!
      text_7: És hogy teljes sebességgel indulj...
      text_8: Itt egy nagyszerű forrás áll az Ön rendelkezésére!
      text_9: Ezt az új ajánlott terjesztési akciót is megtalálja...
      text_10: Biztosan több felhasználható forrásod van!
      dashboard_button: Hajrá, fedezd fel őket!
