    budget_investment_created:
      subject: Köszönöm, hogy befektetett!
      title: Köszönöm, hogy befektetett!
      intro: Szia. <strong>%{author}</strong>,
      text: Köszönöm, hogy létrehoztad a befektetésed. <strong>%{investment}</strong> részt vevő költségvetésekhez <strong>%{budget}</strong>.
      follow: Tájékoztatjuk Önt arról, hogyan halad a folyamat, amelyet Ön is nyomon követhet <strong>%{link}</strong>.
      follow_link: Részvételi költségvetés
      sincerely: Tisztelettel,
      share: A projekt megosztása
    budget_investment_unfeasible:
      title: Az Ön beruházási projektje megvalósíthatatlannak bizonyult.
      hi: Kedves felhasználó!
      new: 'Mindezekre, kérjük, hogy dolgozzon ki egy <strong>új beruházások</strong> a folyamat körülményeihez igazodik.
        Ezt a linket követheti: %{url}.'
      new_href: új beruházási projekt
      sincerely: Tisztelettel
      sorry: Elnézést a kellemetlenségért, és ismét köszönjük a felbecsülhetetlen értékű részvételt.
