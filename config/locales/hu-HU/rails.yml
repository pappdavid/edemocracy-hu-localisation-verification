hu:
  date:
    abbr_month_names:
    - null
    - jan
    - Február
    - márc
    - Április
    - május
    - Június
    - Július
    - Augusztus
    - szept
    - Október
    - November
    - December
    month_names:
    - null
    - január
    - február
    - március
    - április
    - május
    - június
    - július
    - augusztus
    - szeptember
    - október
    - november
    - december
    abbr_day_names:
    - Nap
    - Hétfő
    - kedd
    - Házasodik
    - cs
    - Péntek
    - Ült
    day_names:
    - vasárnap
    - hétfő
    - kedd
    - szerda
    - csütörtök
    - péntek
    - szombat
    formats:
      default: '%Y-%m-%d'
      long: '%B %d, %Y'
      short: '%b %d'
  number:
    currency:
      format:
        precision: 2
        significant: false
        strip_insignificant_zeros: false
        delimiter: ','
        format: '%u%n'
        separator: .
        unit: $
    format:
      precision: 3
      significant: false
      strip_insignificant_zeros: false
      delimiter: ','
      separator: .
    human:
      format:
        precision: 3
        significant: true
        strip_insignificant_zeros: true
        delimiter: ''
      decimal_units:
        format: '%n %u'
        units:
          billion: Milliárd
          million: Millió
          quadrillion: Kvadrillió
          thousand: Ezer
          trillion: billió
          unit: ''
      storage_units:
        format: '%n %u'
        units:
          byte:
            one: bájt
            other: Bájtok
          gb: GB
          kb: KB
          mb: MB
          tb: tuberkulózis
    percentage:
      format:
        delimiter: ''
        format: '%n%'
    precision:
      format:
        delimiter: ''
  datetime:
    distance_in_words:
      about_x_hours:
        one: kb 1 óra
        other: körülbelül %{count} óra
      about_x_months:
        one: kb 1 hónap
        other: körülbelül %{count} hónap
      about_x_years:
        one: kb 1 év
        other: körülbelül %{count} év
      almost_x_years:
        one: majdnem 1 éve
        other: közel %{count} év
      half_a_minute: fél perc
      less_than_x_minutes:
        one: kevesebb mint egy perc
        other: kevesebb, mint %{count} perc
      less_than_x_seconds:
        one: kevesebb, mint 1 másodperc
        other: kevesebb, mint %{count} másodperc
      over_x_years:
        one: több mint 1 év
        other: több mint %{count} év
      x_days:
        one: 1 nap
        other: '%{count} nap'
      x_minutes:
        one: 1 perc
        other: '%{count} perc'
      x_months:
        one: 1 hónap
        other: '%{count} hónap'
      x_years:
        one: 1 év
        other: '%{count} év'
      x_seconds:
        one: 1 másodperc
        other: '%{count} másodperc'
    prompts:
      day: Nap
      hour: Óra
      minute: Perc
      month: Hónap
      second: Másodpercek
      year: Év
  errors:
    format: '%{attribute} %{message}'
    messages:
      accepted: el kell fogadni
      blank: nem lehet üres
      present: üresnek kell lennie
      confirmation: nem egyezik %{attribute}
      empty: nem lehet üres
      equal_to: egyenlőnek kell lennie %{count}
      even: egyenletesnek kell lennie
      exclusion: fenntartva van
      greater_than: nagyobbnak kell lennie, mint %{count}
      greater_than_or_equal_to: nagyobbnak vagy egyenlőnek kell lennie, mint %{count}
      inclusion: nem szerepel a listán
      invalid: érvénytelen
      less_than: kisebbnek kell lennie, mint %{count}
      less_than_or_equal_to: kisebbnek vagy egyenlőnek kell lennie, mint %{count}
      model_invalid: 'Az érvényesítés sikertelen: %{errors}'
      not_a_number: nem szám
      not_an_integer: egész számnak kell lennie
      odd: furcsanak kell lennie
      required: léteznie kell
      taken: már elvitték
      too_long:
        one: túl hosszú (maximum 1 karakter)
        other: túl hosszú (legfeljebb %{count} karakter)
      too_short:
        one: túl rövid (legalább 1 karakter)
        other: túl rövid (minimum %{count} karakter)
      wrong_length:
        one: rossz hosszúságú (1 karakterből kell állnia)
        other: rossz hosszúságú (%{count} karakterből kell állnia)
      other_than: nem lehet %{count}
    template:
      body: 'Problémák adódtak a következő mezőkkel:'
      header:
        one: 1 hiba tiltotta ennek az %{model} mentését
        other: Az %{count} hibák megtiltották az %{model} mentését
  helpers:
    select:
      prompt: Kérjük, válasszon
    submit:
      create: '%{model} létrehozása'
      submit: Mentés %{model}
      update: '%{model} frissítése'
  support:
    array:
      last_word_connector: ', és'
      two_words_connector: és
      words_connector: ','
  time:
    am: de.
    formats:
      datetime: '%Y-%m-%d %H:%M:%S'
      default: '%a, %d %b %Y %H:%M:%S %z'
      long: '%B %d, %Y %H:%M'
      short: '%d %b %H:%M'
      short_datetime: '%Y-%m-%d %H:%M'
      api: '%Y-%m-%d %H'
    pm: du.
