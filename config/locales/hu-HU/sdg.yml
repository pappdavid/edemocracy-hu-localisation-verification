      goal_13:
        title: Éghajlat-politika
        title_in_two_lines: 'Éghajlat

          Intézkedés'
        description: Sürgős lépéseket kell tenni az éghajlatváltozás és hatásai elleni küzdelem érdekében.
        long_description: <p>2019 volt a <a href="https://news.un.org/en/story/2020/03/1059061">a második legmelegebb év</a>
          és a valaha feljegyzett legmelegebb évtized (2010- 2019) vége. & nbsp; & nbsp;</p>  <p>Szén-dioxid (CO2) szintek
          és egyéb <a href="https://news.un.org/en/story/2020/04/1062332">a légkörben előforduló üvegházhatású gázok</a> új
          rekordokra emelték 2019-ben. & nbsp;</p>  <p>Az éghajlatváltozás minden kontinensen minden országot érint. Megzavarja
          a nemzeti gazdaságokat és befolyásolja az életeket. Változnak az időjárási viszonyok, emelkedik a tengerszint, és
          egyre szélsőségesebbek az időjárási események.</p>  <p>Bár az üvegházhatást okozó gázok kibocsátása 2020-ban várhatóan
          mintegy 6% -kal csökken a COVID- 19 pandémiából eredő utazási tilalmak és gazdasági lassulások miatt, ez a javulás
          csak átmeneti. <a href="https://news.un.org/en/story/2020/04/1062332">Az éghajlatváltozás nem áll meg.</a>. Amint
          a világgazdaság kezd talpra állni a világjárvány, a kibocsátások várhatóan visszatér a magasabb szintre.</p>  <p>Az
          életmentéshez és a megélhetéshez sürgős intézkedésekre van szükség mind a világjárvány, mind pedig az éghajlati
          szükséghelyzet kezelésére.</p>  <p>A <a href="https://unfccc.int/process-and-meetings/the-paris-agreement/the-paris-agreement">Párizsi
          Megállapodás</a>2015-ben elfogadott célja, hogy megerősítse az éghajlatváltozás veszélyére adott globális választ
          azáltal, hogy a globális hőmérséklet-emelkedést ebben a században jóval 2 Celsius-fok alatt tartja az iparosodás
          előtti szint felett. A megállapodás célja továbbá az is, hogy megerősítse az országok képességét az éghajlatváltozás
          hatásainak kezelésére, megfelelő pénzügyi áramlások, új technológiai keret és fokozott kapacitásépítési keret révén.</p>
        targets:
          target_13_1:
            long_title: A klimatizált veszélyekkel és természeti katasztrófákkal szembeni ellenálló képesség és alkalmazkodóképesség
              megerősítése valamennyi országban.
            short_title: Az éghajlatváltozással kapcsolatos katasztrófákhoz való ellenálló képesség és alkalmazkodóképesség
              megerősítése
          target_13_2:
            long_title: Az éghajlatváltozással kapcsolatos intézkedések beépítése a nemzeti politikákba, stratégiákba és tervezésbe.
            short_title: Az éghajlatváltozással kapcsolatos intézkedések beépítése a politikákba és a tervezésbe
          target_13_3:
            long_title: Az éghajlatváltozás mérséklésével, az alkalmazkodással, a hatáscsökkentéssel és a korai figyelmeztetéssel
              kapcsolatos oktatás, figyelemfelkeltés, valamint az emberi és intézményi kapacitás javítása.
            short_title: Tudás és képesség építése az éghajlatváltozás kezelésére
          target_13_A:
            long_title: Az Egyesült Nemzetek Éghajlat-változási Keretegyezményében részt vevő országok által vállalt kötelezettségvállalás
              végrehajtása annak érdekében, hogy 2020-ig minden forrásból együttesen 100 milliárd dollárt mozgósítsanak a
              fejlődő országok szükségleteinek kielégítése érdekében, a végrehajtással kapcsolatos érdemi enyhítő intézkedések
              és átláthatóság összefüggésében, valamint a Zöld Éghajlat-változási Alap mielőbbi tőkésítése révén teljes mértékben
              működőképessé váljon.
            short_title: Az ENSZ éghajlat-változási keretegyezményének végrehajtása
          target_13_B:
            long_title: A legkevésbé fejlett országokban és a kis szigetfejlődő államokban a hatékony éghajlat-változási tervezéshez
              és irányításhoz szükséges kapacitás növelésére szolgáló mechanizmusok előmozdítása, többek között a nőkre, az
              ifjúságra, valamint a helyi és marginalizált közösségekre összpontosítva.
            short_title: A tervezési és irányítási kapacitás növelésére irányuló mechanizmusok előmozdítása
