hu:
  sdg:
    goals:
      goal_1:
        title: Nincs szegénység
        title_in_two_lines: 'Nem

          Szegénység'
        description: Vess véget a szegénységnek minden formájában, mindenhol.
        long_description: <p>Globálisan a mélyszegénységben élők száma az 1990-es 36 százalékról 2015-re 10 százalékra csökkent.
          A változás üteme azonban lassul, és a COVID-19 válság <a href="https://www.un.org/sites/un2.un.org/files/sg_report_socio-economic_impact_of_covid19.pdf">
          azt kockáztatja, hogy a szegénység elleni küzdelem több évtizedes előrehaladását</a> megfordítja. <a href="https://www.wider.unu.edu/node/237051">Az
          UNU World Institute for Development Economics Research által közzétett új kutatás</a> arra figyelmeztet, hogy a
          globális világjárvány <a href="https://www.wider.unu.edu/publication/estimates-impact-covid-19-global-poverty">
          gazdasági következményei akár félmilliárd emberrel </a>, vagyis a teljes emberiség 8%-ával növelhetik a globális
          szegénységet. Ez lenne az első alkalom, hogy 1990 óta harminc év alatt globálisan nőtt a szegénység.</p> <p>Több
          mint <a href="http://www.worldbank.org/en/news/press-release/2018/09/19/decline-of-global-extreme-poverty-continues-but-has-slowed-world-bank">700
          millió ember</a>, vagyis a világ népességének 10 százaléka, még ma is rendkívüli szegénységben él, és a legalapvetőbb
          egészségügyi, oktatási és vízellátási szükségletek kielégítéséért küzd. A napi 1,90 dollárnál kevesebbből élő emberek
          többsége a Szaharától délre fekvő Afrikában él. Világszerte az <a href="https://unstats.un.org/sdgs/report/2019/goal-01/">szegénységi
          ráta a vidéki területeken 17,2 százalék</a> – ez több mint háromszorosa a városi területeknek. </p> <p>A dolgozók
          számára az állás nem garantálja a tisztességes megélhetést. Valójában 2018-ban világszerte a foglalkoztatott munkavállalók
          és családjaik <a href="https://unstats.un.org/sdgs/report/2019/goal-01/">8 százaléka</a> élt rendkívüli szegénységben.
          Minden ötödik gyermek él rendkívüli szegénységben. A szegénység csökkentése szempontjából kritikus fontosságú minden
          gyermek és más kiszolgáltatott csoport szociális védelmének biztosítása.</p>
        targets:
          target_1_1:
            long_title: 2030-ra mindenhol fel kell számolni a szélsőséges szegénységet, amely jelenleg napi 1,25 dollárnál
              kevesebbből él
            short_title: Az extrém szegénység felszámolása
          target_1_2:
            long_title: 2030-ra legalább felére kell csökkenteni a szegénységben élő minden korosztályú férfiak, nők és gyermekek
              arányát annak minden dimenziójában a nemzeti meghatározások szerint
            short_title: A szegénység csökkentése legalább 50%-kal
          target_1_3:
            long_title: Végre kell hajtani a nemzeti szinten megfelelő szociális védelmi rendszereket és intézkedéseket mindenki
              számára, beleértve a padlószinteket is, és 2030-ra a szegények és a kiszolgáltatottak jelentős lefedettségének
              elérése
            short_title: Szociális védelmi rendszerek végrehajtása
          target_1_4:
            long_title: 2030-ra biztosítsa, hogy minden férfi és nő, különösen a szegények és a kiszolgáltatottak, egyenlő
              jogokkal rendelkezzenek a gazdasági erőforrásokhoz, valamint az alapvető szolgáltatásokhoz, a földtulajdonhoz
              és a tulajdonjoghoz és a tulajdonhoz, az örökséghez, a természeti erőforrásokhoz, a megfelelő új technológiához
              és pénzügyi szolgáltatásokhoz, beleértve a mikrofinanszírozást is.
            short_title: Egyenlő jogok a tulajdonhoz, az alapvető szolgáltatásokhoz, a technológiához és a gazdasági erőforrásokhoz
          target_1_5:
            long_title: 2030-ra növelni kell a szegények és a kiszolgáltatott helyzetben lévők ellenálló képességét, és csökkenteni
              kell az éghajlattal összefüggő szélsőséges eseményekkel és egyéb gazdasági, társadalmi és környezeti sokkokkal
              és katasztrófákkal szembeni kitettségüket és sebezhetőségüket
            short_title: A környezeti, gazdasági és társadalmi katasztrófákkal szembeni ellenálló képesség kialakítása
          target_1_A:
            long_title: Biztosítsa a források jelentős mozgósítását különféle forrásokból, többek között a megerősített fejlesztési
              együttműködés révén, hogy megfelelő és kiszámítható eszközöket biztosítson a fejlődő országoknak, különösen
              a legkevésbé fejlett országoknak a szegénység minden dimenziójában való felszámolására irányuló programok és
              politikák végrehajtására.
            short_title: Erőforrások mozgósítása a szegénység felszámolását célzó politikák végrehajtásához
          target_1_B:
            long_title: Szilárd politikai keretek létrehozása nemzeti, regionális és nemzetközi szinten, szegénybarát és nemi
              szempontokat figyelembe vevő fejlesztési stratégiákon alapulva a szegénység felszámolását célzó intézkedésekbe
              történő felgyorsított befektetések támogatása érdekében
            short_title: Szegénybarát és a nemek közötti egyenlőségre érzékeny politikai keretek létrehozása
      goal_2:
        title: Az éhezés felszámolása
        title_in_two_lines: 'Nulla

          Éhség'
        description: Az éhezés felszámolása.
        long_description: <p>Több évtizedes folyamatos hanyatlás után 2015-ben az éhezésben szenvedők száma - az alultápláltság
          előfordulási gyakorisága alapján mérve - ismét lassan nőtt. A jelenlegi becslések szerint <a href="http://www.fao.org/publications/sofi/2020/en/">Közel
          690 millió ember éhes, vagyis a világ népességének 8,9 százaléka.</a> - 10 millió emberrel egy év alatt, és közel
          60 millióval öt év alatt.</p>  <p>A világ nem képes 2030-ra elérni a Zéró Éhezőt. Ha a legutóbbi tendenciák folytatódnak,
          az éhezés által érintett emberek száma 2030-ra 840 millió fölé emelkedne.</p>  <p>A Világélelmezési Program szerint,
          <a href="https://www.wfp.org/publications/2020-global-report-food-crises">135 millió szenved akut éhség</a> nagyrészt
          az emberek által okozott konfliktusok, az éghajlatváltozás és a gazdasági visszaesés miatt. A COVID- 19 pandémia
          megduplázhatja ezt a számot, és 2020 végére további 130 millió embert fenyeget akut éhség veszélye.</p>  <p>Több
          mint <a href="https://insight.wfp.org/covid-19-will-almost-double-people-in-acute-hunger-by-end-of-2020-59df0c4a8072">negyedmilliárd
          ember az éhezés szélén</a>gyors lépéseket kell tenni annak érdekében, hogy a legveszélyeztetettebb régiók élelmezést
          és humanitárius segítséget kapjanak.</p>  <p>Ugyanakkor a globális élelmiszer- és mezőgazdasági rendszer mélyreható
          változására van szükség, ha a ma éhező több mint 690 millió embert akarjuk táplálni - és a & nbsp;<a href="https://www.un.org/development/desa/en/news/population/world-population-prospects-2019.html">további
          2 milliárd ember</a>& nbsp; A világ 2050-re lesz. A mezőgazdasági termelékenység növelése és a fenntartható élelmiszer-termelés
          elengedhetetlen az éhezés veszélyeinek enyhítéséhez.</p>
        targets:
          target_2_1:
            long_title: 2030-ra vessen véget az éhezésnek, és biztosítsa, hogy minden ember – különösen a szegények és a kiszolgáltatott
              helyzetben lévők – beleértve a csecsemőket is – egész évben biztonságos, tápláló és elegendő élelmiszerhez jussanak.
            short_title: Univerzális hozzáférés a biztonságos és tápláló élelmiszerekhez
          target_2_2:
            long_title: 2030-ra fel kell számolni az alultápláltság minden formájával, ideértve az 5 év alatti gyermekek növekedésére
              és elsorvadására vonatkozó, nemzetközileg elfogadott célkitűzések 2025-ig történő elérését, valamint a serdülő
              lányok, a terhes és szoptató nők és az idősek táplálkozási szükségleteinek kielégítését.
            short_title: Vess véget az alultápláltság minden formájának
          target_2_3:
            long_title: 2030-ra megduplázza a kisüzemi élelmiszertermelők, különösen a nők, az őslakosok, a családi gazdálkodók,
              a pásztorok és a halászok mezőgazdasági termelékenységét és jövedelmét, többek között a földhöz, más termelő
              erőforrásokhoz és inputokhoz, tudáshoz, pénzügyi szolgáltatásokhoz, piacokhoz, valamint értéknövelési és nem
              mezőgazdasági foglalkoztatási lehetőségekhez való biztonságos és egyenlő hozzáférés révén.
            short_title: Duplázza meg a kisipari élelmiszertermelők termelékenységét és bevételeit
          target_2_4:
            long_title: 2030-ig biztosítsa a fenntartható élelmiszer-termelési rendszereket, és alkalmazzon olyan ellenálló
              mezőgazdasági gyakorlatokat, amelyek növelik a termelékenységet és a termelést, elősegítik az ökoszisztémák
              fenntartását, erősítik az éghajlatváltozáshoz, szélsőséges időjáráshoz, aszályhoz, áradásokhoz és egyéb katasztrófákhoz
              való alkalmazkodási képességet, és fokozatosan javítják a talaj és a talaj minőségét.
            short_title: Fenntartható élelmiszertermelés és rugalmas mezőgazdasági gyakorlatok
          target_2_5:
            long_title: 2020-ra a vetőmagok, a kultúrnövények, valamint a tenyésztett és háziasított állatok, valamint a hozzájuk
              kapcsolódó vadon élő fajok genetikai sokféleségének fenntartása, többek között nemzeti, regionális és nemzetközi
              szintű, megfelelően kezelt és diverzifikált vetőmag- és növénybankok révén, valamint a genetikai erőforrások
              és a kapcsolódó hagyományos ismeretek hasznosításából adódó előnyökhöz való hozzáférés, valamint azok méltányos
              és méltányos megosztásának előmozdítása a nemzetközi megállapodásoknak megfelelően.
            short_title: Fenntartani a genetikai sokféleséget az élelmiszer-termelésben
          target_2_A:
            long_title: A vidéki infrastruktúrába, a mezőgazdasági kutatási és bővítési szolgáltatásokba, a technológiafejlesztésbe,
              valamint a növény- és állattenyésztési génbankokba történő beruházások növelése, többek között a megerősített
              nemzetközi együttműködés révén, a fejlődő országok, különösen a legkevésbé fejlett országok mezőgazdasági termelési
              kapacitásának növelése érdekében.
            short_title: Fektessen be a vidéki infrastruktúrába, a mezőgazdasági kutatásba, a technológiába és a génbankokba
          target_2_B:
            long_title: A világ mezőgazdasági piacain a kereskedelmi korlátozások és torzulások kijavítása és megelőzése,
              többek között a mezőgazdasági exporttámogatás minden formájának és az azzal azonos hatású exportintézkedéseknek
              párhuzamos megszüntetése révén, a dohai fejlesztési forduló mandátumával összhangban.
            short_title: Megakadályozza a mezőgazdasági kereskedelmi korlátozásokat, a piaci torzulásokat és az exporttámogatásokat
          target_2_C:
            long_title: Intézkedések elfogadása az élelmiszer-árupiacok és származékaik megfelelő működésének biztosítására,
              valamint a piaci információkhoz való időben történő hozzáférés elősegítésére, beleértve az élelmiszer-tartalékokat
              is, az élelmiszerárak szélsőséges ingadozásának korlátozása érdekében.
            short_title: Stabil élelmiszerpiacok és az információkhoz való időben történő hozzáférés biztosítása
      goal_3:
        title: Jó egészséget és jó közérzetet
        title_in_two_lines: 'Jó egészséget

          és a Jólét'
        description: Biztosítson egészséges életet és mozdítsa elő a jólétet minden korosztály számára.
        long_description: <p>Az egészséges élet biztosítása és a jólét előmozdítása minden korosztályban elengedhetetlen a
          fenntartható fejlődéshez. Jelenleg a világ szembesül a <a href="https://www.un.org/coronavirus">globális egészségügyi
          válság</a> Ellentétben bármely más - COVID- 19 terjeszti az emberi szenvedést, destabilizálja a globális gazdaságot,
          és emberek milliárdjainak életét teszi tönkre szerte a világon. & nbsp;</p>  <p>A pandémia előtt jelentős előrelépés
          történt a <a href="https://unstats.un.org/sdgs/report/2019/goal-03/">emberek millióinak egészségének javítása</a>Jelentős
          előrelépés történt a várható élettartam növelésében, valamint a gyermek- és anyai mortalitáshoz társuló néhány gyakori
          gyilkos számának csökkentésében. Azonban több erőfeszítésre van szükség a betegségek széles körének teljes körű
          felszámolásához, valamint számos különböző, tartósan fennálló és kialakulóban lévő egészségügyi kérdés megoldásához.
          Az egészségügyi rendszerek hatékonyabb finanszírozására, a jobb higiéniára és higiéniára, valamint az orvosokhoz
          való fokozott hozzáférésre összpontosítva jelentős előrelépés érhető el a milliók életének megmentésében.</p>  <p>Az
          olyan egészségügyi vészhelyzetek, mint a COVID- 19 globális kockázatot jelentenek, és megmutatták, hogy kritikus
          szükség van a felkészültségre. Az Egyesült Nemzetek Fejlesztési Programja kiemelte, hogy a <a href="https://www.undp.org/content/undp/en/home/news-centre/news/2020/COVID19_UNDP_data_dashboards_reveal_disparities_among_countries_to_cope_and_recover.html">az
          országok képességei a COVID- 19 válságból való kilábalásra és kilábalásra</a>. A pandémia egy vízválasztó pillanat
          az egészségügyi veszélyhelyzet felkészültség és a beruházások kritikus 21. századi közszolgáltatások. & nbsp;</p>
        targets:
          target_3_1:
            long_title: 2030-ra csökkentse a globális anyai halálozási arányt 100 000 élveszületésre számítva 70 alá.
            short_title: Az anyai halandóság csökkentése
          target_3_2:
            long_title: 2030-ra meg kell szüntetni az újszülöttek és az 5 év alatti gyermekek megelőzhető halálozását, és
              minden ország arra törekszik, hogy az újszülöttek halálozását 1000 élveszületésre számítva legalább 12-re, az
              5 év alatti halálozást pedig 1000 élveszületésre számítva legalább 25-re csökkentse.
            short_title: Vége minden megelőzhető halálesetnek 5 éves kor alatt
          target_3_3:
            long_title: 2030-ra meg kell szüntetni az AIDS, a tuberkulózis, a malária és az elhanyagolt trópusi betegségek
              járványait, és küzdeni a hepatitis, a víz által terjedő betegségek és más fertőző betegségek ellen.
            short_title: Küzdj a fertőző betegségek ellen
          target_3_4:
            long_title: 2030-ra a megelőzés és a kezelés révén egyharmadával csökkenteni kell a nem fertőző betegségek miatti
              korai halálozást, valamint előmozdítani a mentális egészséget és a jólétet.
            short_title: Csökkentse a nem fertőző betegségek okozta halálozást és támogassa a mentális egészséget
          target_3_5:
            long_title: A kábítószerrel való visszaélés megelőzésének és kezelésének megerősítése, beleértve a kábítószerrel
              való visszaélést és az alkohol káros fogyasztását.
            short_title: A kábítószerrel való visszaélés megelőzése és kezelése
          target_3_6:
            long_title: 2020-ra felére kell csökkenteni a közúti balesetekben bekövetkezett halálesetek és sérülések számát.
            short_title: Csökkentse a közúti sérülések és halálesetek számát
          target_3_7:
            long_title: 2030-ra biztosítsa a szexuális és reproduktív egészségügyi szolgáltatásokhoz való egyetemes hozzáférést,
              ideértve a családtervezést, a tájékoztatást és az oktatást, valamint a reproduktív egészségügy nemzeti stratégiákba
              és programokba való integrálását.
            short_title: Univerzális hozzáférés a szexuális és reproduktív gondozáshoz, családtervezéshez és oktatáshoz
          target_3_8:
            long_title: Univerzális egészségügyi fedezet elérése, beleértve a pénzügyi kockázatok védelmét, a minőségi alapvető
              egészségügyi szolgáltatásokhoz való hozzáférést, valamint a biztonságos, hatékony, minőségi és megfizethető
              alapvető gyógyszerekhez és vakcinákhoz való hozzáférést mindenki számára.
            short_title: Univerzális egészségügyi lefedettség elérése
          target_3_9:
            long_title: 2030-ra jelentősen csökkenteni kell a veszélyes vegyi anyagok okozta halálesetek és megbetegedések
              számát, valamint a levegő-, víz- és talajszennyezés és szennyeződések számát.
            short_title: Csökkentse a betegségek és a halálozások számát a veszélyes vegyi anyagok és a szennyezés miatt
          target_3_A:
            long_title: Adott esetben minden országban meg kell erősíteni az Egészségügyi Világszervezet Dohányzás-ellenőrzési
              Keretegyezményének végrehajtását.
            short_title: A WHO dohányzás-ellenőrzési keretegyezményének végrehajtása
          target_3_B:
            long_title: Az elsősorban a fejlődő országokat érintő fertőző és nem fertőző betegségek elleni vakcinák és gyógyszerek
              kutatásának és fejlesztésének támogatása, hozzáférés biztosítása megfizethető alapvető gyógyszerekhez és oltóanyagokhoz
              a TRIPS-egyezményről és a közegészségügyről szóló dohai nyilatkozattal összhangban, amely megerősíti a fejlődő
              országok jogát arra, hogy maradéktalanul alkalmazzák a Megállapodásban foglalt rendelkezéseket a közegészségügy,
              a szellemi tulajdon, a rugalmasság és a szellemi tulajdon védelmére vonatkozó különleges jogok biztosítására
              vonatkozóan. gyógyszerekhez való hozzáférés mindenki számára.
            short_title: Támogassa a kutatást, fejlesztést és a megfizethető oltóanyagokhoz és gyógyszerekhez való egyetemes
              hozzáférést
          target_3_C:
            long_title: Jelentősen növelni kell az egészségügy finanszírozását, valamint az egészségügyi munkaerő toborzását,
              fejlesztését, képzését és megtartását a fejlődő országokban, különösen a legkevésbé fejlett országokban és a
              fejlődő kis szigetállamokban.
            short_title: Az egészségügyi finanszírozás növelése és az egészségügyi munkaerő támogatása a fejlődő országokban
          target_3_D:
            long_title: Valamennyi ország, különösen a fejlődő országok kapacitásának megerősítése a nemzeti és globális egészségügyi
              kockázatok korai előrejelzésére, kockázatcsökkentésére és kezelésére.
            short_title: A globális egészségügyi kockázatokra vonatkozó korai előrejelző rendszerek fejlesztése
      goal_4:
        title: Minőségi oktatás
        title_in_two_lines: 'Minőség

          Oktatás'
        description: Minőségi oktatás.
        long_description: <p>Az oktatás lehetővé teszi a felfelé irányuló társadalmi-gazdasági mobilitást, és kulcsfontosságú
          a szegénységből való kilépéshez. Az elmúlt évtizedben jelentős előrelépés történt az oktatáshoz való hozzáférés
          és az iskolai beiratkozások arányának növelésében minden szinten, különösen a lányok esetében. Ennek ellenére <a
          href="http://uis.unesco.org/en/topic/out-school-children-and-youth">körülbelül 260 millió gyerek még mindig nem
          járt iskolába</a> 2018-ban – ez a világ népességének közel egyötöde ebben a korcsoportban. És világszerte a gyermekek
          és serdülők több mint fele <a href="https://unstats.un.org/sdgs/report/2019/goal-04/">nem teljesíti a minimális
          készségkövetelményeket</a> az olvasás és a matematika terén. </p> <p>2020-ban, amikor a COVID-19 világjárvány világszerte
          elterjedt, az országok többsége bejelentette az iskolák átmeneti bezárását19, mint ahányan több diákot. 2020 áprilisáig
          közel <a href="https://en.unesco.org/covid19/educationresponse">1,6 milliárd gyermek és fiatal nem járt iskolába</a>.
          Közel <a href="https://www.un.org/sites/un2.un.org/files/policy_brief_on_covid_impact_on_children_16_april_2020.pdf">369
          millió, iskolai étkezésre szoruló gyermeknek</a> pedig más forrásokat kellett keresnie a napi táplálékhoz. </p>
          <p>Soha korábban nem járt ennyi gyermek egyszerre az iskolából, ami megzavarta a tanulást és felborította az életet,
          különösen a legsebezhetőbbek és a marginalizáltak életét. A globális világjárványnak messzemenő következményei vannak,
          amelyek veszélyeztethetik a globális oktatás javítása terén elért, keményen elért eredményeket.</p>
        targets:
          target_4_1:
            long_title: 2030-ra gondoskodni kell arról, hogy minden lány és fiú elvégezze az ingyenes, méltányos és minőségi
              általános és középfokú oktatást, amely releváns és a 4. cél szerinti hatékony tanulási eredményekhez vezet.
            short_title: Ingyenes általános és középfokú oktatás
          target_4_2:
            long_title: 2030-ra biztosítsa, hogy minden lány és fiú hozzáférjen a minőségi koragyermekkori fejlesztéshez,
              gondozáshoz és óvodai neveléshez, hogy készen álljon az alapfokú oktatásra.
            short_title: Egyenlő hozzáférés a minőségi iskola előtti oktatáshoz
          target_4_3:
            long_title: 2030-ra minden nő és férfi számára egyenlő hozzáférést kell biztosítani a megfizethető és minőségi
              műszaki, szakképzéshez és felsőoktatáshoz, beleértve az egyetemet is.
            short_title: Egyenlő hozzáférés megfizethető műszaki, szakképzéshez és felsőoktatáshoz
          target_4_4:
            long_title: 2030-ra jelentősen növelni kell azoknak a fiataloknak és felnőtteknek a számát, akik rendelkeznek
              a foglalkoztatáshoz, a tisztességes munkákhoz és a vállalkozói szellemhez szükséges készségekkel, beleértve
              a műszaki és szakmai készségeket.
            short_title: Növelje a pénzügyi sikerhez szükséges készségekkel rendelkező emberek számát
          target_4_5:
            long_title: 2030-ra szüntesse meg a nemek közötti egyenlőtlenségeket az oktatásban, és biztosítsa az oktatás és
              a szakképzés minden szintjéhez való egyenlő hozzáférést a kiszolgáltatottak számára, beleértve a fogyatékkal
              élőket, az őslakosokat és a veszélyeztetett helyzetben lévő gyermekeket.
            short_title: Minden diszkrimináció megszüntetése az oktatásban
          target_4_6:
            long_title: 2030-ra gondoskodni kell arról, hogy minden fiatal és a felnőttek jelentős része – férfiak és nők
              egyaránt – elsajátítsa az írni-olvasni és számolni tudást.
            short_title: Univerzális írás- és számolási készség
          target_4_7:
            long_title: 2030-ra gondoskodni kell arról, hogy minden tanuló megszerezze a fenntartható fejlődés előmozdításához
              szükséges ismereteket és készségeket, többek között a fenntartható fejlődésre és a fenntartható életmódra, az
              emberi jogokra, a nemek közötti egyenlőségre, a béke és az erőszakmentesség kultúrájának előmozdítására, a globális
              állampolgárságra, valamint a kulturális sokszínűség és a kultúra fenntartható fejlődéshez való hozzájárulásának
              elismerésére.
            short_title: Oktatás a fenntartható fejlődésért és a globális polgárságért
          target_4_A:
            long_title: Olyan oktatási létesítmények építése és fejlesztése, amelyek érzékenyek a gyermekekre, a fogyatékosságra
              és a nemekre, és biztonságos, erőszakmentes, befogadó és hatékony tanulási környezetet biztosítanak mindenki
              számára.
            short_title: Inkluzív és biztonságos iskolák építése és fejlesztése
          target_4_B:
            long_title: 2020-ig globálisan jelentősen bővíteni kell a fejlődő országok, különösen a legkevésbé fejlett országok,
              a fejlődő kis szigetállamok és afrikai országok számára a felsőoktatásba való beiratkozáshoz, beleértve a szakképzést,
              valamint az információs és kommunikációs technológiai, műszaki, mérnöki és tudományos programokat a fejlett
              országokban és más fejlődő országokban.
            short_title: A felsőoktatási ösztöndíjak kiterjesztése a fejlődő országok számára
          target_4_C:
            long_title: 2030-ra jelentősen növelni kell a képzett tanárok kínálatát, többek között a fejlődő országokban,
              különösen a legkevésbé fejlett országokban és a fejlődő kis szigetállamokban a tanárképzés terén folytatott
              nemzetközi együttműködés révén.
            short_title: A képzett tanárok kínálatának növelése a fejlődő országokban
      goal_5:
        title: Nemek közötti egyenlőség
        title_in_two_lines: 'Nem

          Egyenjogúság'
        description: El kell érni a nemek közötti egyenlőséget, és minden nőt és lányt felhatalmazni.
        long_description: '<p>A nemek közötti egyenlőség nemcsak alapvető emberi jog, hanem egy békés, virágzó és fenntartható
          világ szükséges alapja is. </p> <p>Az elmúlt évtizedekben <a href="https://www.unwomen.org/-/media/headquarters/attachments/sections/library/publications/2020/gender-equality-womens-rights-in-review-key-facts-and-figures-en.pdf?la=en&amp;vs=935">fejlődés</a>
          történt: egyre több lány jár iskolába, kevesebb nő kerül a házasságba, egyre több nő kerül a parlamentbe, és egyre
          több nő kerül be a parlamentbe a törvényeket a nemek közötti egyenlőség előmozdítása érdekében reformálják meg. </p>
          <p>Ezen előnyök ellenére számos <a href="https://www.unwomen.org/-/media/headquarters/attachments/sections/library/publications/2020/gender-equality-womens-rights-in-review-key-facts-and-figures-en.pdf?la=en&amp;vs=935">kihívás</a>
          továbbra is fennáll: a diszkriminatív törvények és társadalmi normák továbbra is elterjedtek, a nők továbbra is
          alulreprezentáltak a politikai vezetés minden szintjén, és 1 a nők és a lányok között5 intim partner által elkövetett
          fizikai vagy szexuális erőszakot 12 hónapon belül tapasztalni.</p> <p>A COVID-19 világjárvány <a href="https://www.un.org/sites/un2.un.org/files/policy_brief_on_covid_impact_on_women_9_apr_2020_updated.pdf">
          hatásai megfordíthatják a nemek közötti egyenlőség és a nők jogai terén elért korlátozott előrelépést</a>.  A koronavírus-járvány
          <a href="https://www.unfpa.org/sites/default/files/resource-pdf/COVID-19_A_Gender_Lens_Guidance_Note.pdf"> súlyosbítja
          a fennálló egyenlőtlenségeket</a> a nők és a lányok között minden területen – az egészségügytől a gazdaságon át
          a biztonságig és a szociális védelemig. </p> <p>A nők aránytalanul nagy szerepet játszanak a vírusra való reagálásban,
          beleértve az otthoni dolgozókat és az egészségügyi ellátás frontvonalát. A nők fizetetlen gondozási munkája jelentősen
          megnőtt az iskolabezárások és az idősek megnövekedett szükségletei miatt. A nőket is jobban sújtják a COVID-19 gazdasági
          hatásai, mivel aránytalanul sokat dolgoznak bizonytalan munkaerőpiacokon. A nők közel 60 százaléka az informális
          gazdaságban dolgozik, ami nagyobb kockázatot jelent a szegénységbe kerülésben. </p> <p>A világjárvány a <a href="https://www.unwomen.org/-/media/headquarters/attachments/sections/library/publications/2020/issue-brief-covid-19-and-ending-violence-against-women-and-girls-en.pdf?la=en&amp;vs=5006">nők
          és lányok elleni erőszak </a> meredek növekedéséhez is vezetett. A bezárási intézkedések hatására sok nő otthon
          rekedt bántalmazóival, és nehezen jut hozzá a megszorításoktól és korlátozásoktól sújtott szolgáltatásokhoz. A megjelenő
          adatok azt mutatják, hogy a világjárvány kitörése óta a nők és lányok elleni erőszak – és különösen a családon belüli
          erőszak – felerősödött.</p>'
        targets:
          target_5_1:
            long_title: Vessünk véget minden nő és lány elleni diszkrimináció minden formájának.
            short_title: A nők és lányok diszkriminációjának megszüntetése
          target_5_2:
            long_title: Szüntesse meg a nők és lányok elleni erőszak minden formáját a köz- és magánszférában, beleértve az
              emberkereskedelmet, a szexuális és egyéb kizsákmányolást is.
            short_title: Vess véget a nők és lányok elleni erőszaknak és kizsákmányolásának
          target_5_3:
            long_title: Szüntess meg minden káros gyakorlatot, mint például a gyermekek, a korai és kényszerházasság és a
              női nemi szervek megcsonkítása.
            short_title: A kényszerházasságok és a nemi szervek csonkításának megszüntetése
          target_5_4:
            long_title: Elismerjék és értékeljék a nem fizetett gondozást és a háztartási munkát a közszolgáltatások, az infrastruktúra
              és a szociális védelmi politikák biztosítása, valamint a háztartáson és családon belüli megosztott felelősség
              előmozdítása révén, ha nemzeti szinten megfelelő.
            short_title: Értékelje a nem fizetett gondozást és mozdítsa elő a megosztott háztartási kötelezettségeket
          target_5_5:
            long_title: Biztosítani kell a nők teljes és hatékony részvételét és egyenlő esélyeit a vezetésre a politikai,
              gazdasági és közéleti döntéshozatal minden szintjén.
            short_title: Biztosítsa a teljes részvételt a vezetésben és a döntéshozatalban
          target_5_6:
            long_title: Biztosítani kell a szexuális és reproduktív egészséghez, valamint a reproduktív jogokhoz való egyetemes
              hozzáférést a Népesedési és Fejlődési Nemzetközi Konferencia cselekvési programjával és a pekingi cselekvési
              platformmal, valamint a felülvizsgálati konferenciáik eredménydokumentumával összhangban.
            short_title: Univerzális hozzáférés a reproduktív egészséghez és jogokhoz
          target_5_A:
            long_title: Végezzen reformokat annak érdekében, hogy a nők egyenlő jogokat biztosítsanak a gazdasági erőforrásokhoz,
              valamint a föld és a tulajdon egyéb formáihoz, a pénzügyi szolgáltatásokhoz, az örökséghez és a természeti erőforrásokhoz
              való tulajdonjoghoz, valamint a feletti ellenőrzéshez, a nemzeti jogszabályokkal összhangban.
            short_title: Egyenlő jogok a gazdasági erőforrásokhoz, a tulajdonjoghoz és a pénzügyi szolgáltatásokhoz
          target_5_B:
            long_title: Az alaptechnológia, különösen az információs és kommunikációs technológia használatának fokozása a
              nők szerepvállalásának előmozdítása érdekében.
            short_title: A nők felhatalmazásának előmozdítása technológia révén
          target_5_C:
            long_title: Hatékony szakpolitikák és végrehajtható jogszabályok elfogadása és megerősítése a nemek közötti egyenlőség
              előmozdítása, valamint minden nő és lány szerepének megerősítése érdekében minden szinten.
            short_title: A nemek közötti egyenlőségre vonatkozó politikák és végrehajtható jogszabályok elfogadása és megerősítése
      goal_6:
        title: Tiszta víz és higiénia
        title_in_two_lines: 'Tiszta Víz

          és Higiénia'
        description: Biztosítson mindenki számára hozzáférést a vízhez és a higiéniához.
        long_description: <p>Miközben jelentős előrelépés történt a tiszta ivóvízhez és a higiéniához való hozzáférés javítása
          terén, emberek milliárdjainak – főként vidéki területeken – továbbra sem hiányoznak ezek az alapvető szolgáltatások.
          Világszerte <a href="https://www.who.int/news-room/detail/18-06-2019-1-in-3-people-globally-do-not-have-access-to-safe-drinking-water-unicef-who">
          minden harmadik embernek nincs hozzáférése biztonságos ivóvízhez</a>, <a href="https://www.unwater.org/water-facts/water-sanitation-and-hygiene/">ötből
          két embernek nincs alapvető kézmosási lehetősége</a> szappannal és vízzel, és több mint <a href="https://news.un.org/en/story/2019/11/1051561">673
          millió ember gyakorol még mindig nyílt székletürítést A COVID-19 világjárvány bebizonyította a higiénia, a higiénia
          és a tiszta vízhez való megfelelő hozzáférés kritikus fontosságát a betegségek megelőzésében és megfékezésében.
          <a href="https://www.unwater.org/water-facts/handhygiene/">A kézhigiénia életeket menthet</a>. Az Egészségügyi Világszervezet
          szerint az <a href="https://www.who.int/news-room/events/detail/2020/05/05/default-calendar/hand-hygiene-day">kézmosás
          az egyik leghatékonyabb intézkedés, amelyet megtehet</a> a kórokozók terjedésének csökkentése és a fertőzések, köztük
          a COVID-19 vírus megelőzése érdekében. Ennek ellenére még mindig több milliárd embernek hiányzik a biztonságos vízelvezetés,
          és a finanszírozás sem megfelelő.</p>
        targets:
          target_6_1:
            long_title: 2030-ra mindenki számára elérhetővé kell tenni a biztonságos és megfizethető ivóvízhez való egyetemes
              és méltányos hozzáférést.
            short_title: Biztonságos és megfizethető ivóvíz
          target_6_2:
            long_title: 2030-ra mindenki számára biztosítani kell a megfelelő és méltányos higiéniához való hozzáférést, és
              véget vetve a nyílt székletürítésnek, különös figyelmet fordítva a nők és lányok, valamint a veszélyeztetett
              helyzetben lévők szükségleteire.
            short_title: Végezze el a nyílt székletürítést, és biztosítson hozzáférést a higiéniai és higiéniai szolgáltatásokhoz
          target_6_3:
            long_title: 2030-ra javítsa a vízminőséget a szennyezés csökkentésével, a lerakás megszüntetésével és a veszélyes
              vegyi anyagok és anyagok kibocsátásának minimalizálásával, a kezeletlen szennyvíz arányának felére csökkentésével,
              valamint az újrahasznosítás és a biztonságos újrafelhasználás jelentős növelésével világszerte.
            short_title: A vízminőség, a szennyvízkezelés és a biztonságos újrafelhasználás javítása
          target_6_4:
            long_title: 2030-ig minden ágazatban jelentősen növelni kell a vízhasználat hatékonyságát, és biztosítani kell
              az édesvíz fenntartható kivonását és ellátását a vízhiány kezelése és a vízhiánytól szenvedők számának jelentős
              csökkentése érdekében.
            short_title: Növelje a vízfelhasználás hatékonyságát és biztosítsa az édesvíz-ellátást
          target_6_5:
            long_title: 2030-ig minden szinten végre kell hajtani az integrált vízkészlet-gazdálkodást, adott esetben a határokon
              átnyúló együttműködést is beleértve.
            short_title: Integrált vízkészlet-gazdálkodás megvalósítása
          target_6_6:
            long_title: 2020-ra meg kell védeni és helyreállítani a vízzel kapcsolatos ökoszisztémákat, beleértve a hegyeket,
              erdőket, vizes élőhelyeket, folyókat, víztartó rétegeket és tavakat.
            short_title: A vízzel kapcsolatos ökoszisztémák védelme és helyreállítása
          target_6_A:
            long_title: 2030-ig terjessze ki a nemzetközi együttműködést és kapacitásépítési támogatást a fejlődő országok
              számára a vízzel és higiéniával kapcsolatos tevékenységek és programok terén, beleértve a vízgyűjtést, a sótalanítást,
              a vízhatékonyságot, a szennyvízkezelést, az újrahasznosítást és az újrahasználati technológiákat.
            short_title: A vízügyi és higiéniai támogatás kiterjesztése a fejlődő országokra
          target_6_B:
            long_title: A helyi közösségek részvételének támogatása és erősítése a víz- és szennyvízgazdálkodás javításában.
            short_title: Támogassa a helyi szerepvállalást a víz- és szennyvízgazdálkodásban
      goal_7:
        title: Megfizethető és tiszta energia
        title_in_two_lines: 'Megfizethető és

          Tiszta Energia'
        description: Megfizethető, megbízható, fenntartható és modern energiához való hozzáférés biztosítása.
        long_description: <p>A világ <a href="https://unstats.un.org/sdgs/report/2019/goal-07/">előrehaladást tesz a 7. cél
          felé</a>, és biztató jelek mutatkoznak arra vonatkozóan, hogy az energia egyre fenntarthatóbb és szélesebb körben
          elérhető. A szegényebb országokban elkezdett felgyorsulni az elektromos áramhoz való hozzáférés, az energiahatékonyság
          tovább javul, a megújuló energia pedig lenyűgöző eredményeket produkál a villamosenergia-ágazatban. </p> <p>Mindazonáltal
          nagyobb figyelmet kell fordítani a tiszta és biztonságos főzési tüzelőanyagokhoz és technológiákhoz való hozzáférés
          javítására 3 milliárd ember számára, valamint a villamosenergia-ágazatban a megújuló energia és a szubharcifikáción
          túlmutató kiterjesztésére. Afrika</p> <p>Az <a href="https://trackingsdg7.esmap.org/">Energia terén elért haladásról
          szóló jelentés</a> globális irányítópultot biztosít az energiához való hozzáférés, az energiahatékonyság és a megújuló
          energia terén elért haladás regisztrálásához. Felméri az egyes országok által e három pillér tekintetében elért
          előrehaladást, és pillanatképet ad arról, hogy milyen messze vagyunk a 2030-ra kitűzött Fenntartható Fejlődési Célok
          elérésétől.</p>
        targets:
          target_7_1:
            long_title: 2030-ra biztosítsa a megfizethető, megbízható és modern energiaszolgáltatásokhoz való egyetemes hozzáférést.
            short_title: Univerzális hozzáférés a modern energiához
          target_7_2:
            long_title: 2030-ra jelentősen növelni kell a megújuló energia részarányát a globális energiamixben.
            short_title: A megújuló energia globális százalékos arányának növelése
          target_7_3:
            long_title: 2030-ra megduplázza az energiahatékonyság globális javulásának ütemét.
            short_title: Duplázza meg az energiahatékonyságot
          target_7_A:
            long_title: 2030-ig fokozza a nemzetközi együttműködést a tiszta energiával kapcsolatos kutatáshoz és technológiához
              való hozzáférés megkönnyítése érdekében, ideértve a megújuló energiát, az energiahatékonyságot és a fejlett
              és tisztább fosszilis tüzelőanyag-technológiát, valamint előmozdítja az energiainfrastruktúrába és a tiszta
              energiatechnológiába történő beruházásokat.
            short_title: A tiszta energiával kapcsolatos kutatásokhoz, technológiához és befektetésekhez való hozzáférés elősegítése
          target_7_B:
            long_title: 2030-ra bővíteni kell az infrastruktúrát és korszerűsíteni a technológiát a modern és fenntartható
              energiaszolgáltatások nyújtásához a fejlődő országokban, különösen a legkevésbé fejlett országokban, a fejlődő
              kis szigetállamokban és a tengerparttal nem rendelkező fejlődő országokban, megfelelő támogatási programjaikkal
              összhangban.
            short_title: Bővítse és frissítse az energiaszolgáltatásokat a fejlődő országok számára
      goal_8:
        title: Tisztességes munka és gazdasági növekedés
        title_in_two_lines: 'Tisztességes munka és

          Gazdasági növekedés'
        description: Az inkluzív és fenntartható gazdasági növekedés, a foglalkoztatás és a mindenki számára elérhető tisztességes
          munka előmozdítása.
        long_description: <p>A fenntartható és inkluzív gazdasági növekedés előmozdíthatja a fejlődést, tisztességes munkahelyeket
          teremthet mindenki számára, és javíthatja az életszínvonalat. </p> <p>A COVID-19 <a href="https://www.un.org/sites/un2.un.org/files/sg_report_socio-economic_impact_of_covid19.pdf">életek
          milliárdjaiban zavart meg</a>, és veszélyezteti a világgazdaságot. A Nemzetközi Valutaalap (IMF) olyan <a href="https://blogs.imf.org/2020/04/14/the-great-lockdown-worst-economic-downturn-since-the-great-depression/">globális
          recesszióra</a> számít, mint 2009-ben, vagy még rosszabb. A munkahelyek megszűnésével a Nemzetközi Munkaügyi Szervezet
          becslése szerint <a href="https://www.ilo.org/global/about-the-ilo/newsroom/news/WCMS_743036/lang--en/index.htm">a
          globális munkaerő közel felét fenyegeti az</a>, hogy elveszíti megélhetését8]. <p><a href="https://developmentfinance.un.org/press-release-financing-sustainable-development-report-2020">Már
          a COVID-19</a> kitörése előtt minden ötödik ország – ahol több milliárd szegénységben élő ember él – 2020-ban valószínűleg
          stagnálni vagy csökkenni fog az egy főre jutó jövedelem. Most az <a href="https://developmentfinance.un.org/press-release-financing-sustainable-development-report-2020">
          gazdasági és pénzügyi megrázkódtatások</a> a COVID-19-hez kapcsolódó ipari termelési zavarok, termelési zavarok
          miatt. az árak, a pénzügyi piacok volatilitása és a növekvő bizonytalanság – kisiklik a már amúgy is langyos gazdasági
          növekedést, és más tényezőkből eredő fokozott kockázatokat is megnövelik.  </p>
        targets:
          target_8_1:
            long_title: Fenntartani kell az egy főre jutó gazdasági növekedést a nemzeti körülményeknek megfelelően, és különösen
              a bruttó hazai termék legalább évi 7 százalékos növekedését a legkevésbé fejlett országokban.
            short_title: Fenntartható gazdasági növekedés
          target_8_2:
            long_title: A gazdasági termelékenység magasabb szintjének elérése diverzifikáció, technológiai korszerűsítés
              és innováció révén, többek között a magas hozzáadott értékű és munkaerő-intenzív ágazatokra való összpontosítás
              révén.
            short_title: Diverzifikáljon, újítson és frissítsen a gazdasági termelékenység érdekében
          target_8_3:
            long_title: A produktív tevékenységeket, a tisztességes munkahelyteremtést, a vállalkozói szellemet, a kreativitást
              és az innovációt támogató fejlesztésorientált politikák előmozdítása, valamint a mikro-, kis- és középvállalkozások
              formalizálásának és növekedésének ösztönzése, többek között a pénzügyi szolgáltatásokhoz való hozzáférés révén.
            short_title: A munkahelyteremtést és a növekvő vállalkozásokat támogató politikák népszerűsítése
          target_8_4:
            long_title: Fokozatosan 2030-ig javítani kell a fogyasztás és a termelés globális erőforrás-hatékonyságát, és
              törekedni kell a gazdasági növekedés és a környezetromlás szétválasztására a fenntartható fogyasztásra és termelésre
              vonatkozó 10 éves programok keretein belül, a fejlett országok vezető szerepével.
            short_title: Az erőforrás-hatékonyság javítása a fogyasztás és a termelés terén
          target_8_5:
            long_title: 2030-ra érjen el teljes és produktív foglalkoztatást és tisztességes munkát minden nő és férfi számára,
              ideértve a fiatalokat és a fogyatékkal élőket is, valamint egyenlő bért az azonos értékű munkáért.
            short_title: Teljes foglalkoztatás és tisztességes munka egyenlő fizetéssel
          target_8_6:
            long_title: 2020-ra jelentősen csökkenteni kell a nem foglalkoztatott, oktatásban és képzésben nem részesülő fiatalok
              arányát.
            short_title: A fiatalok foglalkoztatásának, oktatásának és képzésének előmozdítása
          target_8_7:
            long_title: Azonnali és hatékony intézkedések meghozatala a kényszermunka felszámolására, a modern rabszolgaság
              és az emberkereskedelem felszámolására, valamint a gyermekmunka legrosszabb formáinak betiltásának és felszámolásának
              biztosítására, beleértve a gyermekkatonák toborzását és felhasználását, valamint 2025-ig a gyermekmunka minden
              formájának megszüntetésére.
            short_title: Vess véget a modern rabszolgaságnak, emberkereskedelemnek és gyermekmunkának
          target_8_8:
            long_title: Védje a munkajogokat, és támogassa a biztonságos munkakörnyezetet minden munkavállaló számára, ideértve
              a migráns munkavállalókat, különösen a migráns nőket és a bizonytalan foglalkoztatásúakat.
            short_title: Védje a munkajogokat és támogassa a biztonságos munkakörnyezetet
          target_8_9:
            long_title: 2030-ig dolgozzon ki és hajtson végre politikákat a fenntartható turizmus előmozdítására, amely munkahelyeket
              teremt, és népszerűsíti a helyi kultúrát és termékeket
            short_title: A hasznos és fenntartható turizmus népszerűsítése
          target_8_10:
            long_title: A hazai pénzintézetek kapacitásának megerősítése a banki, biztosítási és pénzügyi szolgáltatásokhoz
              való mindenki hozzáférésének ösztönzése és kiterjesztése érdekében.
            short_title: Univerzális hozzáférés a banki, biztosítási és pénzügyi szolgáltatásokhoz
          target_8_A:
            long_title: A fejlődő országok, különösen a legkevésbé fejlett országok számára nyújtott kereskedelemsegély-támogatás
              növelése, többek között a legkevésbé fejlett országoknak nyújtott kereskedelemmel kapcsolatos technikai segítségnyújtás
              fokozott integrált keretrendszerén keresztül.
            short_title: A Kereskedelmi támogatás növelése
          target_8_B:
            long_title: 2020-ig a fiatalok foglalkoztatására vonatkozó globális stratégia kidolgozása és működtetése, valamint
              a Nemzetközi Munkaügyi Szervezet Globális Munkaügyi Paktumának végrehajtása.
            short_title: Globális ifjúsági foglalkoztatási stratégia kidolgozása
      goal_9:
        title: Ipar, innováció és infrastruktúra
        title_in_two_lines: 'Ipar, innováció

          és infrastruktúra'
        description: Rugalmas infrastruktúra kiépítése, a fenntartható iparosítás előmozdítása és az innováció előmozdítása.
        long_description: <p>Inkluzív és fenntartható iparosodás, <a href="https://unstats.un.org/sdgs/report/2019/goal-09/">innováció
          és infrastruktúra</a>a foglalkoztatottságot és jövedelmet generáló dinamikus és versenyképes gazdasági erőket szabadíthat
          fel. Kulcsszerepet játszanak az új technológiák bevezetésében és előmozdításában, a nemzetközi kereskedelem megkönnyítésében
          és az erőforrások hatékony felhasználásának lehetővé tételében. & nbsp;</p>  <p>A világnak azonban még hosszú utat
          kell megtennie e potenciál teljes kiaknázása érdekében. A legkevésbé fejlett országoknak fel kell gyorsítaniuk gyártási
          ágazatuk fejlődését, ha meg kívánják valósítani a 2030-ig tartó időszakra vonatkozó célkitűzést, és fokozniuk kell
          a tudományos kutatásba és innovációba történő beruházásokat. & nbsp;</p>  <p>A globális gyártási növekedés folyamatosan
          csökken, még a COVID- 19 járvány kitörése előtt is. A pandémia <a href="https://unctad.org/en/pages/newsdetails.aspx?OriginalVersionID=2297">Ütköző
          feldolgozóipar</a> a globális értékláncok és a termékértékesítés súlyos és zavarokat okoz. & nbsp;</p>  <p>Az innováció
          és a technológiai fejlődés kulcsfontosságú ahhoz, hogy tartós megoldásokat találjunk mind a gazdasági, mind a környezeti
          kihívásokra, mint például a fokozott erőforrás-hatékonyságra. Globálisan, <a href="https://sustainabledevelopment.un.org/content/documents/26158Final_SG_SDG_Progress_Report_14052020.pdf">kutatási
          és fejlesztési beruházások</a> (K + F), mivel a GDP egy része a 2000-es 1,5% -ról 2015-re 1,7% -ra nőtt, és 2017-ben
          szinte változatlan maradt, de a fejlődő régiókban csak 1% -nál kevesebb volt.</p>  <p>Ami a kommunikációs infrastruktúrát
          illeti, a világ lakosságának több mint fele online él, és szinte az egész világ egy mobilhálózat által lefedett
          területen él. A becslések szerint 2019-ben, <a href="https://sustainabledevelopment.un.org/content/documents/26158Final_SG_SDG_Progress_Report_14052020.pdf">96,5%
          -ot legalább 2G hálózat fedezett</a>. & nbsp; & nbsp; & nbsp; & nbsp;</p>  <p>A coronavirus pandémia felfedte a
          sürgős <a href="https://www.unescap.org/blog/covid-19-reveals-urgent-need-resilient-infrastructure">Rugalmas infrastruktúra
          szükségessége</a>Az Ázsiai Fejlesztési Bank megjegyzi, hogy a régió kritikus infrastruktúrája sok országban messze
          nem megfelelő, annak ellenére, hogy a régió az elmúlt évtizedben gyors gazdasági növekedést és fejlődést tapasztalt.
          A <a href="https://www.unescap.org/publications/economic-and-social-survey-asia-and-pacific-2019-ambitions-beyond-growth">Ázsia
          és a Csendes-óceán gazdasági és társadalmi felmérése</a> hangsúlyozza, hogy az infrastruktúra katasztrófákkal és
          éghajlatváltozással szembeni ellenálló képességének biztosítása évi 434 milliárd dolláros további beruházást tesz
          szükségessé. Ennek az összegnek néhány alrégióban, például a csendes-óceáni kis szigetek fejlődő államaiban még
          nagyobbnak kell lennie. & nbsp; & nbsp; & nbsp; </p>
        targets:
          target_9_1:
            long_title: Minőségi, megbízható, fenntartható és ellenálló infrastruktúra fejlesztése, beleértve a regionális
              és határokon átnyúló infrastruktúrát is, a gazdasági fejlődés és az emberi jólét támogatása érdekében, a mindenki
              számára megfizethető és méltányos hozzáférésre összpontosítva.
            short_title: Fenntartható, rugalmas és befogadó infrastruktúrák fejlesztése
          target_9_2:
            long_title: Az inkluzív és fenntartható iparosítás előmozdítása, és 2030-ra jelentősen növelni kell az ipar részesedését
              a foglalkoztatásban és a bruttó hazai termékben, összhangban a nemzeti körülményekkel, és megkétszerezni részesedését
              a legkevésbé fejlett országokban.
            short_title: Az inkluzív és fenntartható iparosítás előmozdítása
          target_9_3:
            long_title: A kisméretű ipari és egyéb vállalkozások – különösen a fejlődő országokban – hozzáférésének növelése
              a pénzügyi szolgáltatásokhoz, beleértve a megfizethető hiteleket, valamint az értékláncokba és piacokba való
              integrációjuk.
            short_title: A pénzügyi szolgáltatásokhoz és piacokhoz való hozzáférés növelése
          target_9_4:
            long_title: 2030-ra korszerűsítse az infrastruktúrát és korszerűsítse az iparágakat, hogy fenntarthatóvá tegyék
              őket, növelve az erőforrás-felhasználás hatékonyságát, valamint a tiszta és környezetkímélő technológiák és
              ipari folyamatok szélesebb körű alkalmazását, és minden ország saját képességeinek megfelelően tegyen lépéseket.
            short_title: Frissítse az összes iparágat és infrastruktúrát a fenntarthatóság érdekében
          target_9_5:
            long_title: Fokozza a tudományos kutatást, fejlessze az ipari ágazatok technológiai képességeit minden országban,
              különösen a fejlődő országokban, beleértve 2030-ig az innováció ösztönzését és az 1 millió főre jutó kutatási
              és fejlesztési dolgozók számának, valamint az állami és magán kutatási és fejlesztési kiadások jelentős növelését.
            short_title: Fokozza a kutatást és frissítse az ipari technológiákat
          target_9_A:
            long_title: Fenntartható és ellenálló infrastruktúra-fejlesztés elősegítése a fejlődő országokban az afrikai országoknak,
              a legkevésbé fejlett országoknak, a tengerparttal nem rendelkező fejlődő országoknak és a fejlődő kis szigetállamoknak
              nyújtott fokozott pénzügyi, technológiai és technikai támogatás révén 18.
            short_title: Fenntartható infrastruktúra-fejlesztés elősegítése a fejlődő országok számára
          target_9_B:
            long_title: A hazai technológiai fejlesztés, a kutatás és az innováció támogatása a fejlődő országokban, többek
              között az ipari diverzifikáció és az áruk értéknövelése szempontjából kedvező szakpolitikai környezet biztosításával.
            short_title: A hazai technológiafejlesztés és az ipari diverzifikáció támogatása
          target_9_C:
            long_title: Jelentősen növelni kell az információs és kommunikációs technológiához való hozzáférést, és törekedni
              kell arra, hogy 2020-ig egyetemes és megfizethető internet-hozzáférést biztosítsanak a legkevésbé fejlett országokban.
            short_title: Univerzális hozzáférés az információs és kommunikációs technológiához
      goal_10:
        title: Csökkentett egyenlőtlenségek
        title_in_two_lines: 'Csökkentett

          Egyenlőtlenségek'
        description: Az országokon belüli és az országok közötti egyenlőtlenségek csökkentése.
        long_description: <p>Az egyenlőtlenségek csökkentése és annak biztosítása, hogy senki ne maradjon le, elengedhetetlen
          a Fenntartható Fejlődési Célok eléréséhez. </p> <p>Az országokon belüli és az országok közötti egyenlőtlenség állandó
          aggodalomra ad okot. Annak ellenére, hogy bizonyos dimenziókban az egyenlőtlenségek csökkentése irányába mutat pozitív
          jelek, mint például egyes országokban csökken a relatív jövedelmi egyenlőtlenség, és az alacsonyabb jövedelmű országok
          kedvezményes kereskedelmi státusza, az <a href="https://unstats.un.org/sdgs/report/2019/goal-10/">egyenlőtlenség
          továbbra is fennáll</a>.</p> <p><a href="https://www.un.org/sustainabledevelopment/goal-of-the-month-may-2020">COVID-19
          sújtotta a legszegényebbeket[],M3. a kiszolgáltatott közösségek a legnehezebb. Reflektorfénybe helyezte a gazdasági
          egyenlőtlenségeket és a törékeny szociális biztonsági hálókat, amelyek miatt a kiszolgáltatott közösségek viselik
          a válság terhét.  Ugyanakkor a társadalmi, politikai és gazdasági egyenlőtlenségek felerősítették a világjárvány
          hatásait.</p> <p>Gazdasági téren a COVID-19 világjárvány jelentősen megnövelte a globális <a href="https://www.ilo.org/global/about-the-ilo/newsroom/news/WCMS_743036/lang--en/index.htm">munkanélküliséget</a>,
          és drámai módon csökkentette a munkavállalók jövedelmét is.</p>[EDM14]][EDM14]] veszélyezteti a <a href="https://data.unwomen.org/resources/covid-19-emerging-gender-data-and-why-it-matters">nemek
          közötti egyenlőség</a> és a nők jogai terén az elmúlt évtizedekben elért korlátozott előrehaladást. Minden területen,
          az egészségtől a gazdaságon, a biztonságon át a szociális védelemig, a COVID-19 hatásait a nők és a lányok csak
          nemük miatt súlyosbítják.</p> <p>Az egyenlőtlenségek az <a href="https://www.un.org/sites/un2.un.org/files/un_policy_brief_on_human_rights_and_covid_23_april_2020.pdf">sebezhető
          lakosság</a> és a gyengülő egészségügyi rendszerekkel küzdő országokban is egyre mélyülnek. A menekülteket és a
          migránsokat, valamint az őslakosokat, az időseket, a fogyatékkal élőket és a gyermekeket különösen fenyegeti a lemaradás
          veszélye. A sebezhető csoportokat célzó <a href="https://www.un.org/en/coronavirus/covid-19-un-counters-pandemic-related-hate-and-xenophobia">gyűlöletbeszéd</a>
          pedig egyre nő.</p>
        targets:
          target_10_1:
            long_title: 2030-ra fokozatosan érje el és tartsa fenn a népesség alsó 40 százalékának jövedelmi növekedését az
              országos átlagnál magasabb ütemben.
            short_title: Csökkentse a jövedelmi egyenlőtlenségeket
          target_10_2:
            long_title: 2030-ra mindenki társadalmi, gazdasági és politikai integrációjának megerősítése és előmozdítása,
              kortól, nemtől, fogyatékosságtól, fajtól, etnikai hovatartozástól, származástól, vallástól, gazdasági vagy egyéb
              helyzettől függetlenül.
            short_title: Az egyetemes társadalmi, gazdasági és politikai befogadás előmozdítása
          target_10_3:
            long_title: Az esélyegyenlőség biztosítása és az eredmények egyenlőtlenségének csökkentése, többek között a diszkriminatív
              törvények, politikák és gyakorlatok megszüntetésével, valamint a megfelelő jogszabályok, politikák és intézkedések
              előmozdításával e tekintetben.
            short_title: Esélyegyenlőség biztosítása és a diszkrimináció megszüntetése
          target_10_4:
            long_title: El kell fogadni a politikákat, különösen a fiskális, bér- és szociális védelmi politikákat, és fokozatosan
              elérni a nagyobb egyenlőséget.
            short_title: Az egyenlőséget előmozdító fiskális és szociális politikák elfogadása
          target_10_5:
            long_title: Javítani kell a globális pénzügyi piacok és intézmények szabályozását és ellenőrzését, és meg kell
              erősíteni az ilyen szabályozások végrehajtását.
            short_title: A globális pénzügyi piacok és intézmények jobb szabályozása
          target_10_6:
            long_title: Biztosítani kell a fejlődő országok fokozott képviseletét és hangját a globális nemzetközi gazdasági
              és pénzügyi intézmények döntéshozatalában annak érdekében, hogy hatékonyabb, hitelesebb, elszámoltathatóbb és
              legitimebb intézményeket hozzanak létre.
            short_title: A fejlődő országok fokozott képviselete a pénzügyi intézményekben
          target_10_7:
            long_title: Az emberek rendezett, biztonságos, szabályos és felelős migrációjának és mobilitásának elősegítése,
              többek között a tervezett és jól irányított migrációs politikák végrehajtása révén.
            short_title: Felelősségteljes és jól irányított migrációs politika
          target_10_A:
            long_title: A fejlődő országok, különösen a legkevésbé fejlett országok tekintetében a különleges és megkülönböztetett
              bánásmód elvének végrehajtása a Kereskedelmi Világszervezet megállapodásaival összhangban.
            short_title: Különleges és megkülönböztetett bánásmód a fejlődő országok számára
          target_10_B:
            long_title: Ösztönözni kell a hivatalos fejlesztési segítségnyújtást és a pénzáramlást, beleértve a közvetlen
              külföldi befektetéseket is, azon államokba, ahol erre a legnagyobb szükség van, különösen a legkevésbé fejlett
              országokba, az afrikai országokba, a fejlődő kis szigetországokba és a tengerparttal nem rendelkező fejlődő
              országokba, nemzeti terveikkel és programjaikkal összhangban.
            short_title: Fejlesztési segítségnyújtás és befektetések ösztönzése a legkevésbé fejlett országokban
          target_10_C:
            long_title: 2030-ra csökkentse 3 százalék alá a migránsok átutalásának tranzakciós költségeit, és szüntesse meg
              az 5 százaléknál magasabb költségű átutalási folyosókat.
            short_title: Csökkentse a migráns átutalások tranzakciós költségeit
      goal_11:
        title: Fenntartható városok és közösségek
        title_in_two_lines: 'Fenntartható városok

          és közösségek'
        description: Tedd befogadóvá, biztonságossá, rugalmassá és fenntarthatóvá a városokat.
        long_description: <p>A világ egyre inkább urbanizálódik. 2007 óta <a href="https://unstats.un.org/sdgs/report/2019/goal-11/">a
          világ népességének több mint fele él városokban</a>, és ez az arány az előrejelzések szerint 2030-ra 60 százalékra
          fog emelkedni. </p> <p>A városok és a nagyvárosi területek a gazdasági növekedés motorjai – a globális GDP mintegy
          60 százalékával járulnak hozzá. Ugyanakkor a globális szén-dioxid-kibocsátás mintegy 70 százalékáért és az erőforrás-felhasználás
          több mint 60 százalékáért is ők adják. </p> <p>A gyors urbanizáció a nyomornegyedek lakóinak számának növekedését,
          a nem megfelelő és túlterhelt infrastruktúrát és szolgáltatásokat (például a hulladékgyűjtést, valamint a víz- és
          szennyvízelvezetési rendszereket, valamint a városi utak és közlekedési rendszerek tervezésének romlását) eredményezi.
          terjeszkedik. </p> <p><a href="https://unhabitat.org/coronavirus-will-travel-incredibly-fast-in-africas-slums-un-habitat-chief-warns">A
          COVID-19</a> hatása a szegény és sűrűn lakott városi területeken lesz a legpusztítóbb, különösen a világ informális
          településein és nyomornegyedeiben élő egymilliárd ember számára, ahol a túlzsúfoltság megnehezíti az olyan javasolt
          intézkedések, mint például a szociális eloszlást segítő intézkedések,</a>. <p>Az ENSZ élelmezésügyi ügynöksége,
          a FAO arra figyelmeztetett, hogy a városi területeken jelentősen megnövekedhet az éhezés és a halálesetek száma,
          ha nem tesznek olyan intézkedéseket, amelyek biztosítanák a szegény és kiszolgáltatott lakosok <a href="https://news.un.org/en/story/2020/05/1063622">élelmiszerhez
          jutását</a>. </p>
        targets:
          target_11_1:
            long_title: 2030-ra mindenki számára biztosítani kell a megfelelő, biztonságos és megfizethető lakhatáshoz és
              alapvető szolgáltatásokhoz való hozzáférést, valamint a nyomornegyedek korszerűsítését.
            short_title: Biztonságos és megfizethető lakhatás
          target_11_2:
            long_title: 2030-ig mindenki számára biztosítani kell a biztonságos, megfizethető, hozzáférhető és fenntartható
              közlekedési rendszerekhez való hozzáférést, javítva a közúti biztonságot, különösen a tömegközlekedés bővítésével,
              különös tekintettel a veszélyeztetett helyzetben lévők, a nők, a gyermekek, a fogyatékkal élők és az idősek
              szükségleteire.
            short_title: Megfizethető és fenntartható közlekedési rendszerek
          target_11_3:
            long_title: 2030-ig minden országban fokozni kell az inkluzív és fenntartható urbanizációt, valamint a részvételen
              alapuló, integrált és fenntartható emberi településtervezés és -gazdálkodás kapacitását.
            short_title: Befogadó és fenntartható urbanizáció
          target_11_4:
            long_title: Erősítse meg a világ kulturális és természeti örökségének védelmére és védelmére irányuló erőfeszítéseket.
            short_title: Védje a világ kulturális és természeti örökségét
          target_11_5:
            long_title: 2030-ra jelentősen csökkenteni kell az elhunytak és az érintettek számát, valamint a katasztrófák,
              köztük a vízzel kapcsolatos katasztrófák által okozott közvetlen gazdasági veszteségeket a globális bruttó hazai
              termékhez viszonyítva, különös tekintettel a szegények és a kiszolgáltatott helyzetben lévő emberek védelmére.
            short_title: Csökkentse a természeti katasztrófák káros hatásait
          target_11_6:
            long_title: 2030-ig csökkenteni kell a városok egy főre jutó kedvezőtlen környezeti hatását, többek között úgy,
              hogy kiemelt figyelmet fordítanak a levegő minőségére, valamint a települési és egyéb hulladékkezelésre.
            short_title: Csökkentse a városok környezeti hatását
          target_11_7:
            long_title: 2030-ra egyetemes hozzáférést kell biztosítani a biztonságos, befogadó és hozzáférhető, zöld és nyilvános
              terekhez, különösen a nők és a gyermekek, az idősek és a fogyatékkal élők számára.
            short_title: Biztosítson hozzáférést a biztonságos és befogadó zöld és nyilvános terekhez
          target_11_A:
            long_title: Támogassa a városi, városkörnyéki és vidéki területek közötti pozitív gazdasági, társadalmi és környezeti
              kapcsolatokat a nemzeti és regionális fejlesztési tervezés megerősítésével.
            short_title: Erős nemzeti és regionális fejlesztési tervezés
          target_11_B:
            long_title: 2020-ra jelentősen növelni kell azon városok és emberi települések számát, amelyek integrált politikákat
              és terveket fogadnak el és hajtanak végre a befogadás, az erőforrás-hatékonyság, az éghajlatváltozás mérséklése
              és az ahhoz való alkalmazkodás, a katasztrófákkal szembeni ellenálló képesség érdekében, és a Sendai katasztrófakockázat-csökkentési
              keretrendszerrel (2015–2030) összhangban dolgozzanak ki és hajtsanak végre holisztikus katasztrófakockázat-kezelést
              minden szinten.
            short_title: A befogadásra, az erőforrás-hatékonyságra és a katasztrófakockázat csökkentésére vonatkozó politikák
              végrehajtása
          target_11_C:
            long_title: A legkevésbé fejlett országok támogatása – többek között pénzügyi és technikai segítségnyújtás révén
              – fenntartható és ellenálló épületek helyi anyagok felhasználásával történő építésében.
            short_title: Támogassa a legkevésbé fejlett országokat a fenntartható és rugalmas építkezésben
      goal_12:
        title: Felelős fogyasztás és termelés
        title_in_two_lines: 'Felelős fogyasztás

          és Termelés'
        description: Fenntartható fogyasztási és termelési minták biztosítása.
        long_description: '<p>A világméretű fogyasztás és termelés – a globális gazdaság mozgatórugója – a természeti környezet
          és az erőforrások olyan felhasználásán nyugszik, amely továbbra is pusztító hatással van a bolygóra. </p> <p>Az
          elmúlt évszázad gazdasági és társadalmi fejlődését környezeti degradáció kísérte, amely éppen a jövőnket veszélyeztető
          – fejlődésünket veszélyezteti. attól függ. </p> <p>Néhány <a href="https://www.unenvironment.org/explore-topics/sustainable-development-goals/why-do-sustainable-development-goals-matter/goal-12">tény
          és szám</a>:</p> <ul> <li style="font-weight: 400">A becslések szerint minden évben az összes megtermelt élelmiszer
          egyharmada – ami 1,3 milliárd tonnának felel meg – a fogyasztói rothadó vagy 1 trillió dollárt éri. a rossz szállítási
          és betakarítási gyakorlatok miatti romlás.</li> <li style="font-weight: 400">Ha az emberek világszerte energiatakarékos
          izzókra váltanának, a világ évente 120 milliárd USD-t takarítana meg.</li> <li style="font-weight: 400">Ha a világ
          népessége 2050-re eléri a 9,6 milliárd főt, akkor a jelenleginek csaknem három bolygó természetes erőforrásának
          megfelelő mennyiségre lenne szükség. életmód.</li> </ul> <p>A COVID-19 világjárvány lehetőséget kínál az országoknak
          olyan fellendülési tervek kidolgozására, amelyek megfordítják a jelenlegi trendeket, és megváltoztatják fogyasztási
          és termelési szokásainkat a fenntarthatóbb jövő felé.</p> <p><a href="https://www.unenvironment.org/explore-topics/resource-efficiency/what-we-do/sustainable-consumption-and-production-policies">A
          fenntartható fogyasztás és termelés kevesebb, ha többet teszünk </a>. A gazdasági növekedés és a környezetromlás
          szétválasztásáról, az erőforrás-hatékonyság növeléséről és a fenntartható életmód előmozdításáról is szól.</p> <p>A
          fenntartható fogyasztás és termelés jelentősen hozzájárulhat a szegénység enyhítéséhez és az alacsony szén-dioxid-kibocsátású
          és zöld gazdaságok felé való átmenethez.</p>'
        targets:
          target_12_1:
            long_title: Végre kell hajtani a fenntartható fogyasztásra és termelésre vonatkozó 10 éves programok keretét,
              minden ország lépést tart, a fejlett országok pedig vezető szerepet vállalnak, figyelembe véve a fejlődő országok
              fejlettségét és képességeit.
            short_title: Hajtsa végre a 10 éves fenntartható fogyasztási és termelési keretrendszert
          target_12_2:
            long_title: 2030-ra valósítsa meg a természeti erőforrások fenntartható kezelését és hatékony felhasználását.
            short_title: A természeti erőforrások fenntartható kezelése és felhasználása
          target_12_3:
            long_title: 2030-ra felére kell csökkenteni az egy főre jutó globális élelmiszer-pazarlást kiskereskedelmi és
              fogyasztói szinten, és csökkenteni kell az élelmiszer-veszteséget a termelési és ellátási láncok mentén, beleértve
              a betakarítás utáni veszteségeket is.
            short_title: Az egy főre jutó élelmiszer-hulladék felére csökkentése
          target_12_4:
            long_title: 2020-ra valósítsa meg a vegyi anyagok és valamennyi hulladék környezetkímélő kezelését az életciklusuk
              során, összhangban az elfogadott nemzetközi keretekkel, és jelentősen csökkentse ezek levegőbe, vízbe és talajba
              való kibocsátását, hogy minimálisra csökkentsék az emberi egészségre és a környezetre gyakorolt ​​káros hatásukat.
            short_title: Vegyi anyagok és hulladékok felelős kezelése
          target_12_5:
            long_title: 2030-ra a megelőzés, a csökkentés, az újrahasznosítás és az újrafelhasználás révén jelentősen csökkenteni
              kell a hulladékkeletkezést.
            short_title: Jelentősen csökkenti a hulladéktermelést
          target_12_6:
            long_title: Ösztönözze a vállalatokat, különösen a nagy és a transznacionális vállalatokat, hogy alkalmazzák a
              fenntartható gyakorlatokat, és integrálják a fenntarthatóságra vonatkozó információkat jelentési ciklusukba.
            short_title: A vállalatok ösztönzése a fenntartható gyakorlatok és a fenntarthatósági jelentések elfogadására
          target_12_7:
            long_title: A fenntartható közbeszerzési gyakorlatok előmozdítása a nemzeti politikákkal és prioritásokkal összhangban.
            short_title: Fenntartható közbeszerzési gyakorlatok előmozdítása
          target_12_8:
            long_title: 2030-ra gondoskodni kell arról, hogy az emberek mindenhol rendelkezzenek a megfelelő információkkal
              és tudatossággal a fenntartható fejlődéssel és a természettel összhangban lévő életmóddal kapcsolatban.
            short_title: A fenntartható életmód egyetemes megértésének előmozdítása
          target_12_A:
            long_title: A fejlődő országok támogatása tudományos és technológiai kapacitásuk megerősítésében a fenntarthatóbb
              fogyasztási és termelési minták felé való elmozdulás érdekében.
            short_title: A fejlődő országok tudományos és technológiai kapacitásának támogatása a fenntartható fogyasztás
              és termelés érdekében
          target_12_B:
            long_title: Eszközök kidolgozása és bevezetése a fenntartható turizmus fenntartható fejlődésre gyakorolt ​​hatásainak
              nyomon követésére, amely munkahelyeket teremt és népszerűsíti a helyi kultúrát és termékeket.
            short_title: Eszközök fejlesztése és alkalmazása a fenntartható turizmus nyomon követésére
          target_12_C:
            long_title: Racionalizálja a nem hatékony fosszilis tüzelőanyag-támogatásokat, amelyek ösztönzik a pazarló fogyasztást
              a piaci torzulások felszámolásával, a nemzeti körülményeknek megfelelően, ideértve az adók szerkezetének átalakítását
              és e káros támogatások fokozatos megszüntetését, hogy tükrözzék környezeti hatásaikat, teljes mértékben figyelembe
              véve a fejlődő országok sajátos szükségleteit és körülményeit, és minimálisra csökkentve a fejlődésükre gyakorolt
              ​​lehetséges káros hatásokat a szegény közösségeket és az érintett közösségeket védő módon.
            short_title: Távolítsa el a pazarló fogyasztást ösztönző piaci torzulásokat
      goal_13:
        title: Klíma Akció
        title_in_two_lines: 'Klíma

          Akció'
        description: Sürgősen tegyen lépéseket az éghajlatváltozás és annak hatásai elleni küzdelem érdekében.
        long_description: <p>2019 volt az <a href="https://news.un.org/en/story/2020/03/1059061">második legmelegebb év a
          rekordban</a>, és a valaha feljegyzett legmelegebb évtized (2010-2019) vége volt. új rekordokra emelkedett 2019-ben. </p>
          <p>Az éghajlatváltozás minden kontinensen minden országot érint. Ez megzavarja a nemzetgazdaságokat és hatással
          van az életekre. Az időjárási minták változnak, a tengerszint emelkedik, az időjárási események pedig szélsőségesebbé
          válnak.</p> <p>Bár az előrejelzések szerint az üvegházhatású gázok kibocsátása 2020-ban körülbelül 6 százalékkal
          csökken az utazási tilalmak és a COVID-19 világjárvány miatti gazdasági lassulások miatt, ez a javulás csak átmeneti.
          <a href="https://news.un.org/en/story/2020/04/1062332">A klímaváltozás nincs szünetben</a>. Amint a világgazdaság
          kezd kilábalni a világjárványból, a kibocsátások várhatóan magasabb szintre fognak visszatérni.</p> <p>Az életek
          és a megélhetés megmentése sürgős intézkedést igényel mind a járvány, mind az éghajlati vészhelyzet kezelése érdekében.</p>
          <p>Az <a href="https://unfccc.int/process-and-meetings/the-paris-agreement/the-paris-agreement">Párizsi Megállapodás</a>,
          amelyet 2004-ben fogadtak el a globális fenyegetés erősítésével században a globális hőmérséklet-emelkedés jóval
          2 Celsius-fok alatt van az iparosodás előtti szinthez képest. A megállapodás célja továbbá az országok azon képességének
          erősítése, hogy kezelni tudják az éghajlatváltozás hatásait, megfelelő pénzügyi áramlások, új technológiai keretrendszer
          és megerősített kapacitásépítési keret révén.</p>
        targets:
          target_13_1:
            long_title: Minden országban meg kell erősíteni az éghajlattal összefüggő veszélyekkel és természeti katasztrófákkal
              szembeni ellenálló képességet és alkalmazkodóképességet.
            short_title: Az éghajlattal kapcsolatos katasztrófákhoz való rugalmasság és alkalmazkodóképesség erősítése
          target_13_2:
            long_title: Az éghajlatváltozással kapcsolatos intézkedések integrálása a nemzeti politikákba, stratégiákba és
              tervezésbe.
            short_title: Az éghajlatváltozással kapcsolatos intézkedések integrálása a politikákba és a tervezésbe
          target_13_3:
            long_title: Az oktatás, a figyelemfelkeltés, valamint az emberi és intézményi kapacitás javítása az éghajlatváltozás
              mérséklésével, az alkalmazkodással, a hatáscsökkentéssel és a korai figyelmeztetéssel kapcsolatban.
            short_title: Építsen tudást és kapacitást az éghajlatváltozás kezelésére
          target_13_A:
            long_title: Végre kell hajtani az Egyesült Nemzetek Éghajlat-változási Keretegyezményének fejlett országok részes
              felei által vállalt kötelezettségvállalást, hogy 2020-ig minden forrásból közösen mozgósítsanak évente 100 milliárd
              dollárt a fejlődő országok szükségleteinek kielégítésére az érdemi mérséklési intézkedések és a végrehajtás
              átláthatósága összefüggésében, és a lehető leghamarabb teljes mértékben működőképessé tegyék a Zöld Klíma Alapot
              annak tőkésítésével.
            short_title: Az ENSZ Éghajlatváltozási Keretegyezményének végrehajtása
          target_13_B:
            long_title: A legkevésbé fejlett országokban és a fejlődő kis szigetállamokban az éghajlatváltozással kapcsolatos
              hatékony tervezés és kezelés kapacitásának növelésére szolgáló mechanizmusok támogatása, beleértve a nőkre,
              fiatalokra, valamint a helyi és marginalizált közösségekre való összpontosítást.
            short_title: A tervezési és irányítási kapacitás növelésére szolgáló mechanizmusok népszerűsítése
      goal_14:
        title: Élet a víz alatt
        title_in_two_lines: 'Élet lent

          Víz'
        description: Az óceánok, tengerek és tengeri erőforrások megőrzése és fenntartható használata.
        long_description: <p>Az óceán mozgatja azokat a globális rendszereket, amelyek lakhatóvá teszik a Földet az emberiség
          számára. Esővizünket, ivóvizünket, időjárásunkat, éghajlatunkat, partvonalainkat, táplálékunk nagy részét, sőt a
          belélegzett levegő oxigénjét is végső soron a tenger szolgáltatja és szabályozza. </p> <p>Az <a href="https://www.unenvironment.org/explore-topics/oceans-seas/why-do-oceans-and-seas-matter">alapvető
          globális erőforrás</a> gondos kezelése a fenntartható jövő kulcsfontosságú eleme. Jelenleg azonban a part menti
          vizek állapota a szennyezés miatt folyamatosan romlik, az óceánok savasodása pedig negatív hatással van az ökoszisztémák
          működésére és a biodiverzitásra. Ez a kisüzemi halászatot is negatívan érinti. </p> <p>Az óceánok megmentésének
          továbbra is prioritásnak kell maradnia. A tengeri biológiai sokféleség kritikus fontosságú az emberek és bolygónk
          egészsége szempontjából. A védett tengeri területeket hatékonyan kell kezelni és megfelelő erőforrásokkal kell ellátni,
          és szabályozásokat kell bevezetni a túlhalászás, a tengerszennyezés és az óceánok elsavasodásának csökkentése érdekében.</p>
        targets:
          target_14_1:
            long_title: 2025-re meg kell akadályozni és jelentősen csökkenteni a tengeri szennyezések minden fajtáját, különösen
              a szárazföldi tevékenységekből eredően, beleértve a tengeri törmeléket és a tápanyagszennyezést.
            short_title: Csökkentse a tengerszennyezést
          target_14_2:
            long_title: 2020-ra fenntartható módon kezelje és védje a tengeri és part menti ökoszisztémákat a jelentős káros
              hatások elkerülése érdekében, többek között az ellenálló képességük megerősítésével, és tegyen lépéseket a helyreállításuk
              érdekében az egészséges és produktív óceánok elérése érdekében.
            short_title: Ökoszisztémák védelme és helyreállítása
          target_14_3:
            long_title: Az óceánok elsavasodásának hatásainak minimalizálása és kezelése, többek között minden szinten megerősített
              tudományos együttműködés révén.
            short_title: Csökkentse az óceán savasodását
          target_14_4:
            long_title: 2020-ig hatékonyan szabályozzák a halászatot, és vessetek véget a túlhalászásnak, az illegális, be
              nem jelentett és szabályozatlan halászatnak, valamint a pusztító halászati ​​gyakorlatoknak, és hajtsanak végre
              tudományosan megalapozott gazdálkodási terveket annak érdekében, hogy a halállományokat a lehető legrövidebb
              időn belül helyreállítsák, legalább olyan szinten, amely a biológiai jellemzőik által meghatározott maximális
              fenntartható hozamot képes elérni.
            short_title: Fenntartható halászat
          target_14_5:
            long_title: 2020-ra meg kell őrizni a tengerparti és tengeri területek legalább 10 százalékát, összhangban a nemzeti
              és nemzetközi joggal, és a rendelkezésre álló legjobb tudományos információk alapján.
            short_title: A tengerparti és tengeri területek megőrzése
          target_14_6:
            long_title: 2020-ra tiltsa be a halászati ​​támogatások bizonyos formáit, amelyek hozzájárulnak a túlkapacitáshoz
              és a túlhalászáshoz, szüntesse meg az illegális, be nem jelentett és szabályozatlan halászatot elősegítő támogatásokat,
              és tartózkodjon új ilyen támogatások bevezetésétől, elismerve, hogy a fejlődő és legkevésbé fejlett országok
              számára megfelelő és hatékony különleges és megkülönböztetett bánásmódot a Kereskedelmi Világszervezet halászati
              ​​tárgyalásainak szerves részét kell képeznie.
            short_title: A túlhalászáshoz hozzájáruló támogatások megszüntetése
          target_14_7:
            long_title: 2030-ra növelje a fejlődő kis szigetállamok és a legkevésbé fejlett országok számára a tengeri erőforrások
              fenntartható használatából származó gazdasági előnyöket, többek között a halászat, az akvakultúra és a turizmus
              fenntartható gazdálkodása révén.
            short_title: Növelje a tengeri erőforrások fenntartható használatából származó gazdasági előnyöket
          target_14_A:
            long_title: Növelje a tudományos ismereteket, fejlessze a kutatási kapacitást és átadja a tengeri technológiát,
              figyelembe véve a Kormányközi Oceanográfiai Bizottság kritériumait és iránymutatásait a tengeri technológia
              átadására vonatkozóan, az óceánok egészségének javítása és a tengeri biológiai sokféleségnek a fejlődő országok
              fejlődéséhez való hozzájárulásának növelése érdekében, különösen a kis szigeteken lévő fejlődő államok és a
              legkevésbé fejlett országok fejlődéséhez.
            short_title: A tudományos ismeretek, a kutatás és a technológia bővítése az óceánok egészségéért
          target_14_B:
            long_title: A kisüzemi kisüzemi halászok hozzáférésének biztosítása a tengeri erőforrásokhoz és piacokhoz.
            short_title: Támogassa a kisméretű halászokat
          target_14_C:
            long_title: Fokozza az óceánok és erőforrásaik védelmét és fenntartható használatát az UNCLOS-ban tükröződő nemzetközi
              jog végrehajtásával, amely jogi keretet biztosít az óceánok és erőforrásaik megőrzéséhez és fenntartható használatához,
              amint arra a The Future We Want 158. bekezdése emlékeztet.
            short_title: A nemzetközi tengerjog végrehajtása és érvényesítése
      goal_15:
        title: Élet a szárazföldön
        title_in_two_lines: 'Élet tovább

          Földet'
        description: Fenntartható erdőgazdálkodás, az elsivatagosodás elleni küzdelem, a talajromlás megállítása és visszafordítása,
          a biológiai sokféleség csökkenésének megállítása.
        long_description: '<p>A természet kritikus fontosságú a túlélésünk szempontjából: a természet ellát bennünket oxigénnel,
          szabályozza az időjárási szokásainkat, beporozza a terményünket, előállítja élelmiszereinket, takarmányainkat és
          rostjainkat. De egyre nagyobb stressznek van kitéve. <a href="https://news.un.org/en/story/2020/04/1061082">Az emberi
          tevékenység a Föld felszínének csaknem 75 százalékát megváltoztatta</a>, ami a vadvilágot és a természetet a bolygó
          egyre kisebb szegletébe szorította.</p> <p>Körülbelül <a href="https://ipbes.net/sites/default/files/2020-02/ipbes_global_assessment_report_summary_for_policymakers_en.pdf">1
          millió állat- és növényfajt fenyeget a kihalás évtizedeken belül – a globális2 szerint2 –10 –M11 szerint][0] –M11
          Értékelő jelentés a biodiverzitásról és az ökoszisztéma-szolgáltatásról. A jelentés átalakító változtatásokat szorgalmaz
          a természet helyreállítása és védelme érdekében. Megállapította, hogy azon ökoszisztémák egészsége, amelyektől mi
          és az összes többi faj is függ, minden eddiginél gyorsabban romlik, és hatással van  gazdaságunk, megélhetésünk,
          élelmezésbiztonságunk, egészségünk és életminőségünk alapjait világszerte. </p> <p>Az emberi tevékenységek és az
          éghajlatváltozás által okozott erdőirtás és elsivatagosodás komoly kihívásokat jelent a fenntartható fejlődés számára,
          és emberek millióinak életét és megélhetését érintette. <a href="https://news.un.org/en/story/2019/05/1038291">Az
          erdők létfontosságúak </a>a földi élet fenntartásában, és jelentős szerepet játszanak az éghajlatváltozás elleni
          küzdelemben. Az <a href="https://news.un.org/en/story/2019/09/1045802">föld-helyreállításba</a> való befektetés
          pedig kritikus fontosságú a megélhetés javítása, a sebezhetőség csökkentése és a gazdaság kockázatainak csökkentése
          szempontjából.</p> <p>Bolygónk egészsége is fontos szerepet játszik az <a href="https://www.unenvironment.org/resources/emerging-zoonotic-diseases-and-links-ecosystem-health-unep-frontiers-2016-chapter">a
          zoonózisos betegségek megjelenésében, amelyek az emberek és az állatok között terjeszthetők.][EDM11.]. Ahogy továbbra
          is behatolunk a törékeny ökoszisztémákba, az embereket egyre szorosabb kapcsolatba hozzuk a vadon élő állatokkal,
          lehetővé téve, hogy a vadon élő állatok kórokozói átterjedjenek az állatokra és az emberekre, növelve a betegségek
          megjelenésének és felszaporodásának kockázatát.</p>'
        targets:
          target_15_1:
            long_title: 2020-ig biztosítsa a szárazföldi és a belvízi édesvízi ökoszisztémák és szolgáltatásaik megőrzését,
              helyreállítását és fenntartható használatát, különös tekintettel az erdőkre, vizes élőhelyekre, hegyekre és
              szárazföldekre, összhangban a nemzetközi megállapodások szerinti kötelezettségekkel.
            short_title: A szárazföldi és édesvízi ökoszisztémák megőrzése és helyreállítása
          target_15_2:
            long_title: 2020-ig mozdítsa elő a fenntartható gazdálkodás megvalósítását minden típusú erdővel, állítsa le az
              erdőirtást, állítsa helyre a leromlott erdőket, és jelentősen növelje az erdősítés és újraerdősítés számát világszerte.
            short_title: Végezze el az erdőirtást és állítsa helyre a leromlott erdőket
          target_15_3:
            long_title: 2030-ig küzdjön le az elsivatagosodás ellen, állítsa helyre a degradált földet és talajt, beleértve
              az elsivatagosodás, aszály és árvizek által sújtott területeket is, és törekedjen egy földromlástól mentes világ
              megteremtésére.
            short_title: Végezze el az elsivatagosodást és állítsa helyre a leromlott területeket
          target_15_4:
            long_title: 2030-ig gondoskodni kell a hegyvidéki ökoszisztémák, köztük biológiai sokféleségük megőrzéséről, hogy
              javítsák képességüket a fenntartható fejlődéshez nélkülözhetetlen előnyök biztosítására.
            short_title: A hegyvidéki ökoszisztémák megőrzésének biztosítása
          target_15_5:
            long_title: Sürgős és jelentős intézkedések meghozatala a természetes élőhelyek degradációjának csökkentése, a
              biológiai sokféleség csökkenésének megállítása, valamint 2020-ig a veszélyeztetett fajok védelme és kihalásának
              megakadályozása érdekében.
            short_title: A biológiai sokféleség és a természetes élőhelyek védelme
          target_15_6:
            long_title: A genetikai erőforrások felhasználásából származó előnyök méltányos és méltányos megosztásának előmozdítása,
              valamint az ilyen erőforrásokhoz való megfelelő hozzáférés előmozdítása a nemzetközi megállapodásoknak megfelelően.
            short_title: A genetikai erőforrásokhoz való hozzáférés és az előnyök igazságos megosztásának elősegítése
          target_15_7:
            long_title: Sürgősen tegyen lépéseket a védett növény- és állatfajok orvvadászatának és kereskedelmének felszámolására,
              valamint az illegális vadon élő állatok és növények iránti kereslet és kínálat kezelése érdekében.
            short_title: Az orvvadászat és a védett fajok kereskedelme felszámolása
          target_15_8:
            long_title: 2020-ig olyan intézkedéseket kell bevezetni, amelyek megakadályozzák az invazív idegen fajok betelepítését
              és jelentősen csökkentik a szárazföldi és vízi ökoszisztémákra gyakorolt ​​hatását, valamint szabályozzák vagy
              felszámolják a kiemelt fajokat.
            short_title: Az invazív idegen fajok megelőzése a szárazföldön és a vízi ökoszisztémákban
          target_15_9:
            long_title: 2020-ra integrálja az ökoszisztéma és a biodiverzitás értékeit a nemzeti és helyi tervezésbe, fejlesztési
              folyamatokba, a szegénység csökkentését célzó stratégiákba és elszámolásokba.
            short_title: Az ökoszisztéma és a biodiverzitás integrálása a kormányzati tervezésbe
          target_15_A:
            long_title: A biológiai sokféleség és az ökoszisztémák megőrzése és fenntartható használata érdekében minden forrásból
              mobilizálja és jelentősen növelje a pénzügyi forrásokat.
            short_title: Növelje a pénzügyi forrásokat az ökoszisztéma és a biológiai sokféleség megőrzéséhez és fenntartható
              használatához
          target_15_B:
            long_title: Jelentős források mozgósítása minden forrásból és minden szinten a fenntartható erdőgazdálkodás finanszírozására,
              és megfelelő ösztönzők biztosítása a fejlődő országok számára az ilyen gazdálkodás előmozdítására, beleértve
              a megőrzést és az erdősítést is.
            short_title: A fenntartható erdőgazdálkodás finanszírozása és ösztönzése
          target_15_C:
            long_title: Növelje az orvvadászat és a védett fajok kereskedelme elleni küzdelemre irányuló erőfeszítések globális
              támogatását, beleértve a helyi közösségek kapacitásának növelését a fenntartható megélhetési lehetőségek keresésére.
            short_title: Küzdj a globális orvvadászat és embercsempészet ellen
      goal_16:
        title: Béke, igazságosság és erős intézmények
        title_in_two_lines: 'Béke, igazságosság és

          Erős intézmények'
        description: Az igazságos, békés és befogadó társadalmak előmozdítása.
        long_description: <p>A konfliktus, a bizonytalanság, a gyenge intézmények és az igazságszolgáltatáshoz való korlátozott
          hozzáférés továbbra is nagy veszélyt jelent a fenntartható fejlődésre. & nbsp;</p>  <p>A <a href="https://www.unhcr.org/en-us/news/press/2019/6/5d03b22b4/worldwide-displacement-tops-70-million-un-refugee-chief-urges-greater-solidarity.html">A
          háború, üldöztetés és konfliktus elől menekülők száma meghaladta a 70 milliót</a> 2018-ban az ENSZ Menekültügyi
          Főbiztossága (UNHCR) közel 70 év alatt a legmagasabb szintet könyvelte el. & nbsp;</p>  <p>2019-ben az ENSZ nyomon
          követte <a href="https://sustainabledevelopment.un.org/content/documents/26158Final_SG_SDG_Progress_Report_14052020.pdf">357
          gyilkosság és 30 erőszakos eltűnés</a> az emberi jogok védelmezőinek, újságíróknak és szakszervezeti képviselőknek
          47 országban.</p>  <p>And the births of around <a href="https://data.unicef.org/topic/child-protection/birth-registration/">minden
          negyedik gyermek</a> az 5 év alatti kort soha nem jegyzik fel hivatalosan, megfosztva őket a jogaik védelme, valamint
          az igazságszolgáltatáshoz és a szociális szolgáltatásokhoz való hozzáférés szempontjából kulcsfontosságú jogi identitás
          bizonyítékától.</p>
        targets:
          target_16_1:
            long_title: Jelentősen csökkenteni kell az erőszak minden formáját és a kapcsolódó halálozási arányt mindenhol.
            short_title: Csökkentse az erőszakot mindenhol
          target_16_2:
            long_title: Vessenek véget a bántalmazásnak, a kizsákmányolásnak, az emberkereskedelemnek és a gyermekek elleni
              erőszaknak és a gyermekek kínzásának minden formájának.
            short_title: Védje meg a gyermekeket a visszaélésektől, a kizsákmányolástól, az emberkereskedelemtől és az erőszaktól
          target_16_3:
            long_title: A jogállamiság előmozdítása nemzeti és nemzetközi szinten, és mindenki számára egyenlő hozzáférés
              biztosítása az igazságszolgáltatáshoz.
            short_title: A jogállamiság előmozdítása és az igazságszolgáltatáshoz való egyenlő hozzáférés biztosítása
          target_16_4:
            long_title: 2030-ra jelentősen csökkenteni kell az illegális pénz- és fegyveráramlást, meg kell erősíteni az ellopott
              vagyontárgyak visszaszerzését és visszaszolgáltatását, és küzdeni kell a szervezett bűnözés minden formája ellen.
            short_title: Küzdelem a szervezett bűnözés és a tiltott pénzügyi és fegyveráramlások ellen
          target_16_5:
            long_title: Jelentősen csökkenteni kell a korrupciót és a vesztegetést annak minden formájában.
            short_title: Jelentősen csökkentse a korrupciót és a vesztegetést
          target_16_6:
            long_title: Hatékony, elszámoltatható és átlátható intézmények kialakítása minden szinten.
            short_title: Hatékony, elszámoltatható és átlátható intézmények kialakítása
          target_16_7:
            long_title: Reszponzív, inkluzív, részvételen alapuló és reprezentatív döntéshozatal biztosítása minden szinten.
            short_title: Reszponzív, befogadó és reprezentatív döntéshozatal biztosítása
          target_16_8:
            long_title: A fejlődő országok részvételének szélesítése és megerősítése a globális kormányzás intézményeiben.
            short_title: A globális kormányzásban való részvétel erősítése
          target_16_9:
            long_title: 2030-ig mindenki számára biztosítson jogi személyazonosságot, beleértve a születési anyakönyvezést
              is.
            short_title: Univerzális jogi személyazonosság biztosítása
          target_16_10:
            long_title: Biztosítani kell az információkhoz való nyilvános hozzáférést és az alapvető szabadságjogok védelmét
              a nemzeti jogszabályokkal és a nemzetközi megállapodásokkal összhangban.
            short_title: Az információkhoz való nyilvános hozzáférés biztosítása és az alapvető szabadságjogok védelme
          target_16_A:
            long_title: A megfelelő nemzeti intézmények megerősítése – többek között nemzetközi együttműködés révén – a kapacitásépítés
              minden szinten, különösen a fejlődő országokban, az erőszak megelőzése, valamint a terrorizmus és a bűnözés
              elleni küzdelem érdekében.
            short_title: A nemzeti intézmények megerősítése az erőszak megelőzése, valamint a terrorizmus és a bűnözés elleni
              küzdelem érdekében
          target_16_B:
            long_title: A fenntartható fejlődést szolgáló, megkülönböztetéstől mentes törvények és politikák előmozdítása
              és érvényesítése.
            short_title: A megkülönböztetéstől mentes törvények és irányelvek előmozdítása és érvényesítése
      goal_17:
        title: Partnerségek a célokért
        title_in_two_lines: 'Partnerségek

          A Gólokért'
        description: Újraéleszteni a globális partnerséget a fenntartható fejlődésért.
        long_description: <p>A fenntartható fejlesztési célok csak erős globális partnerségekkel és együttműködéssel valósíthatók
          meg.</p> <p>A sikeres fejlesztési menetrendhez olyan átfogó partnerségekre van szükség – globális, regionális, nemzeti
          és helyi szinten –, amelyek elvekre és értékekre, valamint közös jövőképre és közös célokra épülnek, amelyek az
          embereket és a bolygót helyezik a középpontba.</p>] kereskedelmet. Ennek ellenére az <a href="https://www.un.org/press/en/2019/ga12191.doc.htm">segélyszintek
          csökkennek</a>, és az adományozó országok nem váltották be a fejlesztésfinanszírozás felgyorsítására tett ígéretüket.</p>
          <p>A COVID-19 világjárvány miatt az <a href="https://www.imf.org/en/Publications/WEO/Issues/2020/04/14/weo-april-2020">globális
          gazdaság</a> az előrejelzések szerint az előrejelzések szerint 2002-ben 2002-ben jelentősen, vagy akár százalékkal
          is zsugorodik. recesszió a nagy gazdasági világválság óta.</p> <p>Erős nemzetközi együttműködésre most minden eddiginél
          nagyobb szükség van annak biztosítására, hogy az országok rendelkezzenek az eszközökkel a világjárványból való kilábaláshoz,
          a jobb helyreállításhoz és a Fenntartható Fejlődési Célok eléréséhez.</p>
        targets:
          target_17_1:
            long_title: A hazai források mozgósításának erősítése, többek között a fejlődő országoknak nyújtott nemzetközi
              támogatás révén, az adó- és egyéb bevételek beszedésére vonatkozó hazai kapacitás javítása érdekében.
            short_title: Erőforrások mozgósítása a hazai bevételek beszedésének javítása érdekében
          target_17_2:
            long_title: A fejlett országokat, hogy maradéktalanul hajtsák végre hivatalos fejlesztési támogatási kötelezettségvállalásaikat,
              ideértve sok fejlett ország azon kötelezettségvállalását, hogy elérjék az ODA/GNI 0,7 százalékát a fejlődő országoknak,
              valamint a ODA/GNI 0,15–0,20 százalékát a legkevésbé fejlett országoknak.
            short_title: Végre kell hajtani az összes fejlesztési támogatási kötelezettségvállalást
          target_17_3:
            long_title: További pénzügyi források mozgósítása a fejlődő országok számára több forrásból.
            short_title: Pénzügyi források mozgósítása a fejlődő országok számára
          target_17_4:
            long_title: Támogassa a fejlődő országokat a hosszú távú adósságfenntarthatóság elérésében az adósságfinanszírozás,
              az adósságkönnyítés és az adósság-átstrukturálás előmozdítását célzó összehangolt politikák révén, valamint
              kezelje a súlyosan eladósodott szegény országok külső adósságát az adósságszorongás csökkentése érdekében.
            short_title: Segítségnyújtás a fejlődő országoknak az adósság fenntarthatóságának elérésében
          target_17_5:
            long_title: Befektetésösztönzési rendszerek elfogadása és végrehajtása a legkevésbé fejlett országok számára.
            short_title: Fektessen be a legkevésbé fejlett országokba
          target_17_6:
            long_title: Az észak-dél, dél-dél és háromoldalú regionális és nemzetközi együttműködés és a tudomány, technológia
              és innováció terén való hozzáférés, valamint a tudásmegosztás fokozása kölcsönösen elfogadott feltételek mellett,
              többek között a meglévő mechanizmusok közötti jobb koordináció révén, különösen az Egyesült Nemzetek szintjén,
              valamint egy globális technológiai könnyítési mechanizmuson keresztül.
            short_title: Tudásmegosztás és együttműködés a tudományhoz, technológiához és innovációhoz való hozzáférés érdekében
          target_17_7:
            long_title: Környezetbarát technológiák fejlesztésének, átadásának, terjesztésének és terjesztésének előmozdítása
              a fejlődő országokban kedvező feltételekkel, beleértve a kedvezményes és kedvezményes feltételeket is, kölcsönös
              megállapodás szerint.
            short_title: A fenntartható technológiák népszerűsítése a fejlődő országokban
          target_17_8:
            long_title: A legkevésbé fejlett országok számára 2017-ig teljes mértékben működőképessé kell tenni a technológiai
              bankot és a tudományos, technológiai és innovációs kapacitásépítési mechanizmust, és fokozni kell az alaptechnológia,
              különösen az információs és kommunikációs technológia használatát.
            short_title: A legkevésbé fejlett országok tudományos, technológiai és innovációs kapacitásának megerősítése
          target_17_9:
            long_title: A fejlődő országokban a hatékony és célzott kapacitásépítés végrehajtásának nemzetközi támogatásának
              fokozása a fenntartható fejlődés valamennyi céljának megvalósítására irányuló nemzeti tervek támogatása érdekében,
              beleértve az észak-déli, dél-déli és háromoldalú együttműködést.
            short_title: Növelje az SDG-kapacitást a fejlődő országokban
          target_17_10:
            long_title: Egy egyetemes, szabályokon alapuló, nyitott, megkülönböztetéstől mentes és méltányos többoldalú kereskedelmi
              rendszer előmozdítása a Kereskedelmi Világszervezet keretein belül, többek között a dohai fejlesztési menetrend
              keretében folytatott tárgyalások lezárásával.
            short_title: Univerzális kereskedelmi rendszer előmozdítása a WTO keretében
          target_17_11:
            long_title: Jelentősen növelni kell a fejlődő országok exportját, különösen annak érdekében, hogy 2020-ra megduplázódjon
              a legkevésbé fejlett országok részesedése a globális exportból.
            short_title: A fejlődő országok exportjának növelése
          target_17_12:
            long_title: Valamennyi legkevésbé fejlett ország esetében a vám- és kvótamentes piacra jutás időben történő, tartós
              végrehajtása, összhangban a Kereskedelmi Világszervezet határozataival, többek között annak biztosításával,
              hogy a legkevésbé fejlett országokból származó behozatalra alkalmazandó preferenciális származási szabályok
              átláthatóak és egyszerűek legyenek, és hozzájáruljanak a piacra jutás megkönnyítéséhez.
            short_title: Távolítsa el a kereskedelmi akadályokat a legkevésbé fejlett országok számára
          target_17_13:
            long_title: A globális makrogazdasági stabilitás fokozása, többek között a szakpolitikai koordináció és a szakpolitikai
              koherencia révén.
            short_title: A globális makrogazdasági stabilitás fokozása
          target_17_14:
            long_title: A politika koherenciájának fokozása a fenntartható fejlődés érdekében.
            short_title: A politika koherenciájának fokozása a fenntartható fejlődés érdekében
          target_17_15:
            long_title: Tartsa tiszteletben az egyes országok politikai mozgásterét és vezető szerepét a szegénység felszámolására
              és a fenntartható fejlődésre irányuló politikák kialakításában és végrehajtásában.
            short_title: Tartsa tiszteletben a nemzeti vezetést a fenntartható fejlődési célok politikáinak végrehajtása érdekében
          target_17_16:
            long_title: Erősítse meg a fenntartható fejlődést célzó globális partnerséget, amelyet több érdekelt felet tömörítő
              partnerségek egészítenek ki, amelyek mozgósítják és megosztják a tudást, a szakértelmet, a technológiát és a
              pénzügyi forrásokat, hogy támogassák a fenntartható fejlődés céljainak elérését minden országban, különösen
              a fejlődő országokban.
            short_title: Erősítse a globális partnerséget a fenntartható fejlődésért
          target_17_17:
            long_title: Ösztönözze és támogassa a hatékony állami, köz-magán és civil társadalmi partnerségeket, a partnerségek
              tapasztalataira és erőforrás-stratégiáira építve.
            short_title: Hatékony partnerségek ösztönzése
          target_17_18:
            long_title: 2020-ig fokozza a fejlődő országoknak nyújtott kapacitásépítési támogatást, beleértve a legkevésbé
              fejlett országokat és a fejlődő kis szigetállamokat is, hogy jelentősen növelje a jövedelem, nem, életkor, faj,
              etnikai hovatartozás, migrációs státusz, fogyatékosság, földrajzi elhelyezkedés és egyéb, nemzeti viszonylatban
              releváns jellemzők szerint lebontott, jó minőségű, időszerű és megbízható adatok elérhetőségét.
            short_title: Növelje a megbízható adatok elérhetőségét
          target_17_19:
            long_title: 2030-ra építsen a meglévő kezdeményezésekre a fenntartható fejlődés terén elért előrehaladás méréseinek
              kidolgozására, amelyek kiegészítik a bruttó hazai terméket, és támogassák a statisztikai kapacitásépítést a
              fejlődő országokban.
            short_title: A haladás mérésének további fejlesztése
