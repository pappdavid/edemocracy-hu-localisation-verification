    accessibility:
      title: Akadálymentesség
      description: |-
        A webes akadálymentesség azt jelenti, hogy a webhely és tartalma a lehető legtöbb ember számára hozzáférhető, függetlenül az esetleges fogyatékosságtól, technikai korláttól vagy a használat körülményeitől.

        A portál fejlesztésénél törekszünk az akadálymentes használatra, és folyamatosan javítjuk a hozzáférhetőséget. Ha akadályt tapasztal, kérjük, jelezze azt az üzemeltetőnek.
      compatibility:
        title: Szabványokkal és vizuális kialakítással való összeegyeztethetőség
        description: 'A portál célja a <strong>Webes Akadálymentesítési Irányelvek</strong> és a W3C <abbr title="Web Accessibility Initiative" lang="en">WAI</abbr> ajánlásainak követése. Az akadálymentesség megfelelőségét rendszeres ellenőrzéssel szükséges értékelni.'
      keyboard_shortcuts:
        browser_table:
          rows:
            - browser_column: Internet Explorer
              key_column: ALT + gyorsbillentyű, majd ENTER
            - browser_column: Firefox
              key_column: ALT + SHIFT + gyorsbillentyű
            - browser_column: Chrome
              key_column: ALT + gyorsbillentyű (Macen CTRL + ALT + gyorsbillentyű)
            - browser_column: Safari
              key_column: ALT + gyorsbillentyű (Macen CMD + gyorsbillentyű)
            - browser_column: Opera
              key_column: SHIFT + ESC + gyorsbillentyű
      textsize:
